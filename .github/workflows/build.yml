name: build

# 三平台构建与发布：
#   - 推 v* tag  → 自动创建 Draft Release 并附三平台安装包
#                 （windows-x64 / macos-arm64 / macos-x64 / linux-x64）
#   - 手动 Run workflow → 仅构建并上传裸可执行文件产物，不创建 Release
# 放云端的原因：Windows 需 MSVC + WiX/NSIS，macOS 包须本机签，Linux 依赖 webkit2gtk。

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# 创建/上传 Release 需要写权限（默认 GITHUB_TOKEN 对 contents 仅为 read）
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # 与平台无关的静态校验，失败就不浪费编译机时
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 静态校验
        run: python scripts/validate.py

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
            bundles: "nsis,msi"
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
            bundles: "dmg"
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            label: macos-x64
            bundles: "dmg"
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
            bundles: "deb"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf build-essential curl wget file libssl-dev

      # windows-latest 默认不带 WiX / NSIS，Tauri 打 msi/nsis 必须显式装。
      # choco 对“已安装/待重启”可能返回非 0，用 || true 避免误伤；关键是把工具 bin 加入 PATH。
      - name: Windows 打包依赖 (WiX + NSIS)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          choco install wixtoolset nsis -y --no-progress || true
          WIX=$(ls -d "/c/Program Files (x86)/WiX Toolset"*/bin 2>/dev/null | head -1)
          [ -n "$WIX" ] && echo "$WIX" >> "$GITHUB_PATH"
          echo "C:/Program Files (x86)/NSIS" >> "$GITHUB_PATH"
          command -v light.exe candle.exe makensis.exe || ls "$WIX"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.label }}

      # 本项目是纯 bin crate（无 lib.rs），测试位于 core/matcher.rs 与 i18n.rs 的 #[cfg(test)] 内，
      # 不能加 --lib，否则 “no library targets found” 直接失败。
      - name: 单元测试（matcher / i18n）
        run: cargo test --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

      # 推 v* tag 时 tauri-action 创建/更新 Draft Release 并上传安装包；
      # 多平台并行时首个创建、其余更新同一 Release（tauri-action 自带 upsert）。
      - name: 打包安装包并发布到 Release（tauri-action）
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('NetSense {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false
          releaseBody: |
            自动构建的预发布安装包，仅供测试。
            - Windows 首次改网络会弹一次 UAC；以管理员运行一次可免除。
            - macOS 未签名，打开时需在“系统设置 → 隐私与安全性”里允许。

      # 即便打包/发布失败，也把裸可执行文件传成产物，方便直接下载手动测试
      - name: 上传裸可执行文件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netsense-${{ matrix.label }}-bin
          path: |
            src-tauri/target/${{ matrix.target }}/release/netsense.exe
            src-tauri/target/${{ matrix.target }}/release/netsense
          if-no-files-found: ignore
