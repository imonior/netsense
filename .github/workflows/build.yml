name: build

# 三平台构建与发布：
#   - 推 v* tag  → 自动创建 Draft Release 并附三平台安装包
#                 （windows-x64 / macos-arm64 / macos-x64 / linux-x64）
#   - 手动 Run workflow → 仅构建并上传裸可执行文件产物，不创建 Release
# 放云端的原因：Windows 需 MSVC + WiX/NSIS，macOS 包须本机签，Linux 依赖 webkit2gtk。

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# 创建/上传 Release 需要写权限（默认 GITHUB_TOKEN 对 contents 仅为 read）
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # 与平台无关的静态校验，失败就不浪费编译机时
  # timeout-minutes：不给 Job 设上限时，若 runner 排队拿不到机器，会一路挂到 GitHub 的
  # 任务上限（此前出现过 macos-x64 任务挂 17 小时才发现）。这里统一兜底。
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 静态校验
        run: python scripts/validate.py

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
            bundles: "nsis,msi"
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
            bundles: "dmg"
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            label: macos-x64
            bundles: "dmg"
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
            bundles: "deb"
    runs-on: ${{ matrix.platform }}
    # 单平台冷启动编译约 3~10 分钟；给 60 分钟上限，既能覆盖首次全量编译，
    # 又能避免 runner 供应不上时无限排队（历史上有过 17h 才被手动取消的情况）。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf build-essential curl wget file libssl-dev

      # windows-latest 默认不带 WiX / NSIS，Tauri 打 msi/nsis 必须显式装。
      # choco 对“已安装/待重启”可能返回非 0，用 || true 避免误伤；关键是把工具 bin 加入 PATH。
      - name: Windows 打包依赖 (WiX + NSIS)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          # 给 choco 装包设硬上限：若 WiX/NSIS 下载stall，步骤会在 900s 失败而非挂到 GitHub 6h 任务上限
          # （此前「第一个 run 卡 13h」很可能就是 choco 下载卡死；`|| true` 只兜底“装完即失败”，挡不住“卡住”）。
          choco install wixtoolset nsis -y --no-progress --timeout 900 || true
          WIX=$(ls -d "/c/Program Files (x86)/WiX Toolset"*/bin 2>/dev/null | head -1)
          [ -n "$WIX" ] && echo "$WIX" >> "$GITHUB_PATH"
          echo "C:/Program Files (x86)/NSIS" >> "$GITHUB_PATH"
          command -v light.exe candle.exe makensis.exe || ls "$WIX"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.label }}

      # 本项目是纯 bin crate（无 lib.rs），测试位于 core/matcher.rs 与 i18n.rs 的 #[cfg(test)] 内，
      # 不能加 --lib，否则 “no library targets found” 直接失败。
      - name: 单元测试（matcher / i18n）
        run: cargo test --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

      # 推 v* tag 时 tauri-action 创建/更新 Draft Release 并上传安装包；
      # 多平台并行时首个创建、其余更新同一 Release（tauri-action 自带 upsert）。
      # Release 说明默认英文：从英文 CHANGELOG.md 的「本版本」段落抽取，避免中文提交污染。
      - name: 生成 Release 说明（英文，来自 CHANGELOG.md）
        id: notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "extracting changelog section for v${VER}"
          awk -v v="## [${VER}]" '
            substr($0,1,4)=="## [" {
              if (p) exit
              if (substr($0,1,length(v))==v && substr($0,length(v)+1,1)==" ") { p=1; next }
            }
            p { print }
          ' CHANGELOG.md > release-notes.md
          echo "---- preview ----"; head -20 release-notes.md
          {
            echo "body<<RELBODY_EOF"
            cat release-notes.md
            echo "RELBODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 打包安装包并发布到 Release（tauri-action）
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('NetSense {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false
          releaseBody: ${{ startsWith(github.ref, 'refs/tags/') && steps.notes.outputs.body || 'Automated pre-release build for testing.' }}

      # 即便打包/发布失败，也把裸可执行文件传成产物，方便直接下载手动测试
      - name: 上传裸可执行文件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netsense-${{ matrix.label }}-bin
          path: |
            src-tauri/target/${{ matrix.target }}/release/netsense.exe
            src-tauri/target/${{ matrix.target }}/release/netsense
          if-no-files-found: ignore
