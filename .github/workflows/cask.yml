name: cask

# 只做一件事：Release 正式发布之后，把两个 macOS dmg 的 SHA256 写进 homebrew-tap 的
# Casks/netsense.rb。真正干活的脚本是 scripts/bump-cask.sh —— 模板只有一份，
# 这里和 build.yml 的 cask 作业都调它。
#
# 为什么这个文件不担任自动那条路：tauri-action 在 tag 推送时建的是 **Draft** Release，
# 而 `releases/download/<tag>/...` 对未发布的 Draft 返回 404；bump 必须等到发布之后。
# 偏偏 build.yml 的 publish 步骤是用 GITHUB_TOKEN 把 draft 翻成 published 的，而 GitHub
# 规定由 GITHUB_TOKEN 产生的事件不再触发工作流 —— 所以 `release: published` 在自动发布
# 这条路上**从来不会响**（连续四次发布，cask 一次都没跟上，tap 停在旧版本）。
# 自动那条路现在住在 build.yml 里：cask 是 publish 的下游作业，同一次运行、同一条依赖链，
# 不依赖任何事件级联。
#
# 这个文件因此只剩两条人工路径：
#   - `release: published`：人在 Release 页面上点 Publish（例如某次运行的 publish 作业
#     失败了、后来手工补发布）；
#   - `workflow_dispatch`：手动补跑，Actions → cask → Run workflow，填入 tag（例如 v1.0.4）。
# 两条都可能与 build.yml 的作业撞车，所以两边共用一个 concurrency 组排队，再由脚本里的
# no-op 守卫吃掉重复。
#
# 同一个 tap 里还有另一个项目的 cask；两者各写各的文件，互不覆盖。但两者的 bump 提交都落在
# 同一条 tap main 上——所以脚本的 push 必须能吸收「另一个项目刚 push 过」造成的
# non-fast-forward（见 scripts/bump-cask.sh 末尾的 rebase + 重试）。
#
# 需要仓库配置 secrets.TAP_PUSH_TOKEN（对 imonior/homebrew-tap 有 Contents: Read and write
# 权限的 fine-grained PAT）。未配置时脚本直接跳过，不把流水线弄红。

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: read

# 与 build.yml 的 cask 作业同名：两条路排到同一条队上，避免同一版本的两次 bump 抢着 push。
concurrency:
  group: cask-tap-sync
  cancel-in-progress: false

jobs:
  cask:
    name: Sync Casks/netsense.rb
    # 预发布版本不更新稳定 cask（tag 含 '-' 由脚本自己挡；这里挡 Release 标了 prerelease 的）
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 解析 tag
        id: meta
        # 走 env 而不是把 ${{ }} 直接写进 run 的脚本体：tag 名是外部输入（release 事件带
        # 的、或人在页面上敲的），inline 插值等于让一段字符串参与 shell 语法解析。
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG:-${INPUT_TAG:-}}"
          if [ -z "$TAG" ]; then
            echo "::error::no tag resolved (release event had no tag_name and no input.tag given)"
            exit 1
          fi
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"
          echo "resolved tag: $TAG"

      # 取的就是 scripts/bump-cask.sh 这一份脚本；不 checkout 就没有脚本可跑。
      - name: Checkout netsense
        uses: actions/checkout@v7

      - name: Bump Casks/netsense.rb
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/bump-cask.sh "$TAG"
