[package]
name = "netsense"
version = "1.6.1"
description = "Cross-platform SSID-aware network profile switcher"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
sha2 = "0.10"

[features]
# default = macOS; 后续加 windows / linux feature gates
default = []
# 用 MockPlatform 顶替编译期选定的真实 PAL，跑完整 Engine 集成测试（快照→判定→下发→3B）。
# 关闭时生产代码路径零改动（Platform 仍是 macos/windows/linux 之一的真实实现）。
engine-mock = []

[target.'cfg(target_os = "macos")'.dependencies]
# CoreWLAN 读现连 SSID（macOS 14+ 唯一稳定来源）；CLLocation 负责一次性索取定位授权；
# objc2 提供 msg_send! / Retained。框架由这些 crate 的 build script 自动链接。
objc2 = "0.6"
objc2-core-location = "0.3"
objc2-core-wlan = "0.3.2"

[target.'cfg(target_os = "linux")'.dependencies]
# 网络读路径原生实现（替 ip link / ip neigh 子进程），见 platform/linux_netlink.rs。
# 只在 Linux 引入，其它平台不编译该模块、也不拉这些依赖。
rtnetlink = "0.23"
# rtnetlink 只把 netlink-packet-route 重导成 `rtnetlink::packet_route`；本模块直接
# 用到 `LinkFlags` / `NeighbourAttribute` 这些报文类型，按 Rust 的依赖声明规则得自己
# 显式声明一份（版本与 rtnetlink 0.23 实际锁定的 0.33 对齐，见 Cargo.lock）。
netlink-packet-route = "0.33"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
# NetworkManager D-Bus 原生化（替 nmcli 子进程），见 platform/linux_nm.rs。
# `blocking` 让我们在同步代码里直接做 D-Bus 调用，无需额外 async runtime 杂耍。
zbus = { version = "4", features = ["blocking"] }

[target.'cfg(target_os = "windows")'.dependencies]
# 提权 helper（见 platform/win_helper.rs）需要的裸 Win32 API：命名管道、安全描述符、
# 客户端进程验证；外加读系统界面语言那一个调用（「跟随系统」的启动路径，拉起 PowerShell
# 去问要秒级，而这一下本来就在启动里）。子进程仍走 std::process。
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
