[package]
name = "netsense"
version = "1.0.2"
description = "Cross-platform SSID-aware network profile switcher"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
sha2 = "0.10"

[features]
# default = macOS; 后续加 windows / linux feature gates
default = []

[target.'cfg(target_os = "macos")'.dependencies]
# CoreWLAN 读现连 SSID（macOS 14+ 唯一稳定来源）；CLLocation 负责一次性索取定位授权；
# objc2 提供 msg_send! / Retained。框架由这些 crate 的 build script 自动链接。
objc2 = "0.6"
objc2-core-location = "0.3"
objc2-core-wlan = "0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
# 提权 helper（见 platform/win_helper.rs）需要的裸 Win32 API：命名管道、安全描述符、
# 客户端进程验证。子进程仍走 std::process，所以 windows-sys 的接触面就这三块。
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
