<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>NetSense</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    /* 结果弹窗是一扇**独立**窗口：不挂在编辑器、托盘面板、设置或日志任何一扇里。
       它常驻置顶、出现时不抢焦点 —— 用户盯着哪扇窗都能看见，又不会被它夺走输入。 */
    :root {
      --card: var(--t-card);
      --line: var(--t-line);
      --fg: var(--t-fg);
      --muted: var(--t-fg-dim);
      --accent: var(--t-accent);
      --ok: var(--t-ok);
      --warn: var(--t-warn);
      --err: var(--t-err);
      --on-accent: var(--t-on-accent);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--card); color: var(--fg);
      font: 12px/1.3 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      border: 1px solid var(--line); border-radius: var(--t-r-md);
      /* 整扇窗就是这张弹窗：本体不滚，只有中间的清单滚，让标题与关闭按钮永远看得见。 */
      display: flex; flex-direction: column; overflow: hidden; padding: 11px 12px;
    }
    h3 { margin: 0 0 6px; font-size: 13px; }
    h3.ok { color: var(--ok); }
    h3.err { color: var(--err); }
    /* 清单区内部滚动：内容再多也不把「关闭」挤出可视区（同面板弹窗的约束）。 */
    .ap-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; }
    .ap-foot { flex: none; }
    .ap-foot-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; }
    .ap-foot-row .ap-time { text-align: left; color: var(--muted); font-size: 11px; }
    .ap-foot-row button {
      flex: none; padding: 5px 16px; font-size: 12px; border-radius: var(--t-r-sm);
      cursor: pointer; border: 1px solid var(--accent);
      background: var(--accent); color: var(--on-accent);
    }
    .mv { font-size: 11px; color: var(--muted); line-height: 1.5; }
    /* 分组清单（系统 / IPv4 / IPv6 / DNS / 动作）：标签在左、值右对齐、每行 ✅/❌，
       失败行下有红色明细，底部错误行 + 时间戳。行距按「紧凑」定，一次能看到尽量多的条目。 */
    .ap-g { color: var(--accent); font-size: 11px; font-weight: 600; margin: 4px 0 1px; }
    .ap-g:first-child { margin-top: 0; }
    .ap-list { border: 1px solid var(--line); border-radius: var(--t-r-sm); overflow: hidden; }
    .ap-item { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 2px 8px; line-height: 1.3; }
    .ap-item + .ap-item { border-top: 1px solid var(--line); }
    .ap-label { color: var(--muted); flex: none; }
    .ap-val { color: var(--fg); font-weight: 600; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ap-mark { flex: none; }
    /* 动作组状态色：成功 / 失败 / 进行中 / 逾期，不压成一个红绿。 */
    .ap-mark.ap-ok { color: var(--ok); }
    .ap-mark.ap-err { color: var(--err); }
    .ap-mark.ap-wait { color: var(--warn); }
    .ap-mark.ap-warn { color: var(--warn); }
    /* 明细两态不同色：网络下发失败行的「已回滚，未生效」= 红；动作失败行 = 琥珀。 */
    .ap-detail { color: var(--err); font-size: 11px; padding: 0 8px 2px; line-height: 1.25; word-break: break-word; }
    .ap-detail.ap-act { color: var(--warn); }
    .ap-err { color: var(--err); font-size: 11px; margin-top: 6px; word-break: break-word; }
    .ap-note { color: var(--warn); font-size: 11px; margin-top: 6px; word-break: break-word; }
  </style>
</head>
<body>
  <h3 id="ap-title"></h3>
  <div class="ap-body" id="ap-body"></div>
  <div class="ap-foot" id="ap-foot"></div>

  <script>
    const hasTauri = () => window.__TAURI__ && window.__TAURI__.core;
    const invoke = (cmd, args) => {
      if (!hasTauri()) return Promise.reject(new Error("no tauri bridge"));
      return window.__TAURI__.core.invoke(cmd, args);
    };
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    let strings = {};
    const t = (k, d) => strings[k] || d || k;

    /// 弹窗当前状态。`base` 是 `netsense://applied` 的载荷；`actions` / `workers`
    /// 来自后续的 `netsense://evaluation`（3B1 逐条结果 / 3B2 实时状态）。
    let apState = null;

    /// 收到应用结果：记住这一轮的载荷，动作结果陆续到达时重画同一张弹窗。
    function renderApplied(d) {
      apState = { base: d || {}, actions: null, workers: null };
      renderAppliedNow();
    }

    /// 3B2 常驻动作的状态 → 标记（五态不压成一个红绿）。
    function apWorkerMark(state) {
      switch (state) {
        case "pending": return { mark: "⏳", cls: "ap-wait" };
        case "satisfied": return { mark: "✅", cls: "ap-ok" };
        case "repaired": return { mark: "✅", cls: "ap-ok" };
        case "faulted": return { mark: "❌", cls: "ap-err" };
        case "overdue": return { mark: "❗", cls: "ap-warn" };
        default: return { mark: "", cls: "" };
      }
    }

    /// 画当前这一版弹窗（网络清单 + 动作结果 + 时间戳）。
    function renderAppliedNow() {
      if (!apState) return;
      const d = apState.base || {};
      const ok = !!d.success;
      // 标题三态：成功 / 失败且已回滚 / 失败但快照恢复也失败（写入状态未知）。
      const title = ok
        ? t("popup.applied_title", "Profile applied: Network setting and Actions")
        : d.restored
          ? t("popup.applied_failed_rb", "Profile rolled back: Network setting and Actions")
          : t("popup.applied_failed_title", "Profile not applied: Network setting and Actions");
      const titleEl = document.getElementById("ap-title");
      titleEl.className = ok ? "ok" : "err";
      titleEl.textContent = title;
      // 分组清单：组头（accent）+ 组内「标签 | 值 ✅/❌」行；ok=null 的身份行不带标记。
      // 行标签后端发的是 i18n key（popup.ip / popup.dns / popup.profile…），必须过
      // t()：直接渲染会原样显示成「popup.dns」这样的 key（1.8.5 的弹窗正是这个错）。
      // 组标题（g.title）后端已按当前语言本地化好，原样显示。
      const groups = Array.isArray(d.groups) ? d.groups : [];
      let list = "";
      for (const g of groups) {
        list += `<div class="ap-g">${esc(g.title)}</div><div class="ap-list">`;
        for (const r of (g.rows || [])) {
          const mark = r.ok === true ? "✅" : r.ok === false ? "❌" : "";
          list += `<div class="ap-item"><span class="ap-label">${esc(t(r.label))}</span>`
            + `<span class="ap-val">${esc(r.value)}${mark ? ` <span class="ap-mark">${mark}</span>` : ""}</span></div>`;
          if (r.detail) list += `<div class="ap-detail">${esc(r.detail)}</div>`;
        }
        list += `</div>`;
      }
      // —— 动作组：3B1 一次性动作 + 3B2 常驻动作 ——
      list += apActionsHtml();
      // 本轮一分写入都没有（系统本就合规 / THEN 缺省）：清单之外补一句说明。
      if (d.nochange) {
        list += `<div class="mv">${esc(t("popup.applied_nochange", "No network parameters were changed"))}</div>`;
      }
      document.getElementById("ap-body").innerHTML = list;
      // 底部行按成败分流：失败原因 = 红色 ❌，降级附注（DNS 兜底等）= 琥珀色。
      const bottom = d.note
        ? (ok ? `<div class="ap-note">${esc(d.note)}</div>`
              : `<div class="ap-err">❌ ${esc(d.note)}</div>`)
        : "";
      document.getElementById("ap-foot").innerHTML = `${bottom}
        <div class="ap-foot-row">
          <span class="ap-time">${esc(t("popup.time", "Time"))}: ${esc(apNow())}</span>
          <button id="ap-close">${esc(t("popup.close", "Close"))}</button>
        </div>`;
      document.getElementById("ap-close").onclick = closeAppliedModal;
    }

    /// 「动作」组：3B1 一次性动作的逐条结果 + 3B2 常驻动作的当前状态。
    ///
    /// 两者都**可能还没到**：3B1 在独立线程上跑，动作没交回结果之前这里显示「运行中」，
    /// 而不是把它藏起来 —— 用户此刻最想知道的就是「那条动作跑起来没有」。
    function apActionsHtml() {
      const actions = apState.actions;   // 3B1：{ running, total, outcomes: [...] }
      const workers = apState.workers;   // 3B2：[{ label, state, interval, repairs, error }]
      if (!actions && !workers) return "";
      let list = `<div class="ap-g">${esc(t("popup.group_actions", "Actions"))}</div><div class="ap-list">`;

      // 3B1：一次性动作（运行软件 / 设默认打印机 / 跑脚本…）
      if (actions) {
        const outs = actions.outcomes || [];
        if (actions.running && outs.length === 0) {
          list += `<div class="ap-item"><span class="ap-label">${esc(t("popup.actions_running", "Running"))}</span>`
            + `<span class="ap-val"><span class="ap-mark ap-wait">⏳</span></span></div>`;
        }
        for (const o of outs) {
          list += `<div class="ap-item"><span class="ap-label">${esc(o.label)}</span>`
            + `<span class="ap-val"><span class="ap-mark ${o.ok ? "ap-ok" : "ap-err"}">${o.ok ? "✅" : "❌"}</span></span></div>`;
          if (o.error) list += `<div class="ap-detail ap-act">${esc(o.error)}</div>`;
        }
        // 还在跑：已完成的列在上面，未完成的给一行「N 条待执行」。
        if (actions.running) {
          const left = Math.max(0, (actions.total || 0) - outs.length);
          if (left > 0) {
            list += `<div class="ap-item"><span class="ap-label">${esc(t("popup.actions_pending", "Pending"))}</span>`
              + `<span class="ap-val">${esc(String(left))} <span class="ap-mark ap-wait">⏳</span></span></div>`;
          }
        }
      }

      // 3B2：常驻动作（维持 VPN / WireGuard / 周期脚本…）
      if (workers && workers.length) {
        for (const w of workers) {
          const st = apWorkerMark(w.state);
          const detail = w.error
            ? w.error
            : (w.repairs > 0
              ? t("popup.actions_repairs", "Restored {n} time(s)").replace("{n}", String(w.repairs))
              : "");
          list += `<div class="ap-item"><span class="ap-label">${esc(w.label)}</span>`
            + `<span class="ap-val"><span class="ap-mark ${st.cls}">${st.mark}</span></span></div>`;
          if (detail) list += `<div class="ap-detail ap-act">${esc(detail)}</div>`;
        }
      }
      list += `</div>`;
      return list;
    }

    /// 本地时间「YYYY-MM-DD HH:MM:SS」：弹窗底部的时间戳（与日志对时间时够用）。
    function apNow() {
      const d = new Date(), p = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} `
        + `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
    }

    /// 关闭：清掉这一轮状态，并让后端把这一扇窗口收起来（不退出应用）。
    function closeAppliedModal() {
      apState = null;
      invoke("close_applied").catch(() => {});
    }

    /// 静态占位：真实内容由事件（`netsense://applied`）驱动，在应用外直接查看这份文件
    /// 时没有 Tauri 桥、事件永远不会来 —— 一只空盒子读作「坏了」。占位文案走 i18n 字典。
    /// Static placeholder: the real content is event-driven (`netsense://applied`), and
    /// with no Tauri bridge (viewing this file outside the app) no event ever arrives —
    /// an empty box reads as "broken". The copy goes through the i18n dictionary.
    ///
    /// 底部**必须**带「关闭」：这扇窗无边框且常驻置顶，一个没有出口的空态会把用户困住
    /// （1.8.6 的教训）。应用内走到这里还会顺手把窗口收起来（没有内容可显示就不该占屏）。
    function renderEmpty() {
      if (apState) return;
      document.getElementById("ap-body").innerHTML =
        `<div class="mv" style="padding:4px 2px;">${esc(t("popup.applied_empty",
          "This window lists what NetSense wrote to the network settings the last time a profile was applied. It is filled in by the running app — apply a profile in NetSense and the result appears here."))}</div>`;
      document.getElementById("ap-foot").innerHTML =
        `<div class="ap-foot-row"><span class="ap-time"></span>`
        + `<button id="ap-close">${esc(t("popup.close", "Close"))}</button></div>`;
      document.getElementById("ap-close").onclick = closeAppliedModal;
    }

    /// 预览模式用的示例载荷：形状与后端 `applied_notice` / `applied_groups` 逐字段同构
    /// （`success` / `restored` / `nochange` / `note` / `groups[{title, rows[{label, value, ok, detail}]}]`），
    /// 分组顺序也照 `applied_groups` 排（System → IPv4 → IPv6 → DNS）。只有**版式**是这份
    /// 示例要展示的东西：值是技术记号（地址、接口名），不是编出来的故事。
    /// Sample payload for preview mode: field-for-field identical to the backend
    /// `applied_notice` / `applied_groups` shape, in the same group order
    /// (System → IPv4 → IPv6 → DNS). Only the **layout** is what this sample shows —
    /// the values are technical tokens (addresses, interface names), not invented stories.
    ///
    /// 行标签用后端发的一模一样的 i18n key（`popup.ip` / `popup.row_mode` …），预览里
    /// 看到的每一行都对应得上真实弹窗的那一行 —— 换一份自造标签就等于画了另一张窗。
    function apDemo() {
      // 标签走一遍 `t()`：真实弹窗里后端发的是 i18n key、由页面拿字典翻；预览没有字典可
      // 加载（`file://` 下取不到 i18n 文件），不翻就会把 `popup.dns` 这样的 key 画到界面上。
      // Labels go through `t()`: the backend sends i18n keys and the page translates them
      // with the dictionary; a preview has no dictionary to load (the i18n files are
      // unreachable under `file://`), so untranslated keys would show up as `popup.dns`.
      // 每个字面量都坐在 `t()` 的实参位置：校验脚本按「多词字面量是否在 t() 里」判文案有没有
      // 写死，而这里每一条本来就是要翻的标签。
      const row = (label, value, ok) => ({ label, value, ok, detail: null });
      return {
        success: true,
        restored: false,
        nochange: false,
        // 底部琥珀色附注：预览里也必须说清这是示例，不是这台机器的真实结果。
        note: t("popup.applied_demo", "Sample data — not from your system"),
        groups: [
          {
            title: t("popup.group_system", "System"),
            rows: [
              row(t("popup.profile", "Applied profile"), "home", null),
              row(t("status.ssid", "SSID"), "Home-5G", null),
              row(t("popup.interface", "Interface"), "en0", null),
            ],
          },
          {
            title: t("popup.group_ipv4", "IPv4"),
            rows: [
              row(t("popup.row_mode", "Mode"), t("editor.manual", "Manual (Static)"), true),
              row(t("popup.ip", "IPv4"), "192.168.1.50", true),
              row(t("popup.netmask", "Netmask"), "255.255.255.0", true),
              row(t("popup.gateway", "Gateway"), "192.168.1.1", true),
              row(t("popup.routes_added", "Routes added"), "2", true),
            ],
          },
          {
            title: t("popup.group_ipv6", "IPv6"),
            rows: [row(t("popup.row_mode", "Mode"), t("editor.linklocal", "Link-local only"), true)],
          },
          {
            title: t("popup.group_dns", "DNS"),
            rows: [row(t("popup.dns", "DNS"), "223.5.5.5 119.29.29.29", true)],
          },
        ],
      };
    }

    /// 预览模式的动作组：3B1 一次性动作两条（一成一败）+ 3B2 常驻动作一条。
    /// 形状同 `netsense://evaluation` 的 `last_run` / `workers`（见 `apActionsHtml`）。
    /// Sample actions for preview mode: two 3B1 one-shot actions (one ok, one failed)
    /// plus one 3B2 persistent worker — same shape as `last_run` / `workers`.
    const AP_DEMO_ACTIONS = {
      running: false,
      total: 3,
      outcomes: [
        { label: "WireGuard", ok: true, error: null },
        { label: "AdGuardHome", ok: true, error: null },
        { label: "mosdns", ok: false, error: "exit 1" },
      ],
    };
    const AP_DEMO_WORKERS = [{ label: "WireGuard", state: "satisfied", repairs: 1 }];

    (async () => {
      // 文案一次性拉全（5 语）；主题那一档由 `netsense://status` 的 `theme` 字段兜底切换，
      // 不单独问（参考面板窗口的 `applyTheme`）。
      try { strings = await invoke("get_strings"); } catch (e) { /* 浏览器直开：显示 key 本身 */ }
      // 主动取一次最近的应用结果：窗口页面加载可能晚于引擎第一轮 pass 的广播
      // （冷启动首次应用就是这种情形），那一发事件送不到刚开的页面上。取回来就画，
      // 取不到说明此刻没有可显示的内容 —— 画占位并把自己收起来，绝不留一扇空窗。
      let last = null;
      try { last = await invoke("get_last_applied"); } catch (e) { /* 浏览器直开 */ }
      if (last) {
        renderApplied(last);
      } else if (!hasTauri()) {
        // 预览模式：这份文件被浏览器直接打开（没有 Tauri 桥，事件永远不会来）。
        // 从前这里是一片占位文案，被读成「弹窗没做出来」—— 现在渲染一份同构示例，
        // 版式、分组顺序、✅/❌ 标记都看得见，底部另有琥珀色一行标明这是示例。
        // 应用内桥必然存在（`tauri://` 下由 Tauri 注入），走不到这条分支。
        renderApplied(apDemo());
        apState.actions = AP_DEMO_ACTIONS;
        apState.workers = AP_DEMO_WORKERS;
        renderAppliedNow();
      } else {
        renderEmpty();
        invoke("close_applied").catch(() => {});
      }
    })();
    renderEmpty();

    // Esc 关闭：无边框置顶窗没有系统关闭按钮，键盘必须有一条出路。
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeAppliedModal();
    });

    if (window.__TAURI__ && window.__TAURI__.event) {
      // 后端在网络切换 / 配置重载 / 手动应用后广播，弹窗窗口据此对色与对语言。
      window.__TAURI__.event.listen("netsense://status", (e) => {
        const p = e.payload || {};
        if (p.theme) document.documentElement.dataset.theme = p.theme;
        if (p.language) document.documentElement.lang = p.language;
      });
      // 自动化应用了某个配置（首次连上 / 网络变化 / 配置变更，且 3A 成功）：弹窗展示
      // 当前应用的配置与网络信息。轮询中若无规则触发改变，后端不发此事件。
      window.__TAURI__.event.listen("netsense://applied", (e) => {
        renderApplied(e.payload || {});
      });
      // 3B1 / 3B2 的动作结果陆续到达：把它们填进**已经打开**的结果弹窗。
      //
      // 为什么单独订阅：`netsense://applied` 只讲网络下发，动作在独立线程上异步跑，
      // 结果从 `netsense://evaluation` 到达 —— 弹窗先开、结果后到是常态。
      // 弹窗没开时不留状态（下一轮 applied 会重新建一份），省得把上一轮的结果挂到这一轮上。
      window.__TAURI__.event.listen("netsense://evaluation", (e) => {
        if (!apState) return;
        const v = e.payload || {};
        const lr = v.last_run || null;
        if (lr) {
          apState.actions = {
            running: !!lr.running,
            total: lr.total || 0,
            outcomes: lr.outcomes || [],
          };
        }
        apState.workers = Array.isArray(v.workers) ? v.workers : [];
        renderAppliedNow();
      });
    }
  </script>
</body>
</html>
