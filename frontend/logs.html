<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>NetSense</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    /* 这一份只在本窗口内起作用的别名：markup 与旧代码认的是左边的名字，
       颜色的真相在 theme.css 的 `--t-*` 那一套里。深浅两套共用同一批别名。 */
    :root {
      --bg: var(--t-bg);
      --bg-card: var(--t-card);
      --line: var(--t-line);
      --fg: var(--t-fg);
      --muted: var(--t-fg-dim);
      --accent: var(--t-accent);
      --ok: var(--t-ok);
      --warn: var(--t-warn);
      --err: var(--t-err);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg); color: var(--fg);
      font: var(--text-wide-body);
      display: flex; flex-direction: column;
    }
    header {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 12px 16px 10px; border-bottom: 1px solid var(--line); flex: none;
    }
    header b { font: var(--text-wide-title); letter-spacing: .2px; }
    /* 头部那一行装的是文件选择器 + 三颗按钮；日志文件名带时间戳，长过窗口时宁可换行，
       也不把按钮挤出可见区（挤出去就等于「刷新」没了）。 */
    .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    select, input[type=text] {
      background: var(--bg-card); color: var(--fg); border: 1px solid var(--line);
      border-radius: var(--t-r-sm); padding: 5px 8px; font: var(--text-wide-callout);
      min-width: 0; max-width: 100%;
    }
    button {
      padding: 5px 12px; font: var(--text-wide-callout); border-radius: var(--t-r-sm); cursor: pointer;
      border: 1px solid var(--line); background: var(--bg-card); color: var(--fg);
      font-family: var(--font-sans);
    }
    button.tiny { padding: 3px 9px; font: var(--text-wide-footnote); color: var(--muted); }
    button:active { transform: translateY(1px); }
    label.chk { display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--muted); }
    main { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 10px 16px 14px; gap: 8px; }
    .bar { display: flex; align-items: center; gap: 10px; flex: none; }
    .bar input[type=text] { flex: 1; min-width: 0; }
    /* 级别筛选：一组切换按钮，选中的那颗高亮（accent 实底）。 */
    .bar .lbl { color: var(--muted); font: var(--text-wide-callout); }
    .bar .lvl { padding: 4px 10px; font: var(--text-wide-callout); }
    .bar .lvl.on { background: var(--accent); color: var(--t-on-accent); border-color: var(--accent); }
    /* 「已显示 N / 共 M 行 · 更旧的…」是本地化句子，五种语言长度差很多：让它截断，
       而不是把同一行的筛选框挤到 0 宽。 */
    .val { color: var(--muted); white-space: nowrap; min-width: 0; overflow: hidden;
           text-overflow: ellipsis; }
    /* 路径是这台机器上的事实，不该被翻译，但要能被完整看清 */
    .path {
      padding: 5px 8px; background: var(--t-sunken); border: 1px solid var(--line);
      border-radius: var(--t-r-sm); font-family: var(--font-mono);
      font-size: 11px; color: var(--t-fg-accent); word-break: break-all; user-select: text; flex: none;
    }
    /* 日志正文从裸 `<pre>` 改成列网格：时间/级别/类别各占固定列，消息吃掉余宽。
       扫读一屏日志时眼睛不再每次重新找列；`contain` 把超长列表的布局与绘制关在这一块里，
       500 行到 5000 行都不会带着整个窗口重排。
       Log body is a column grid instead of a bare <pre>: fixed time/level/category
       columns, message takes the rest. `contain` keeps long lists from relayouting
       the whole window. */
    .log-body {
      flex: 1; min-height: 0; overflow: auto; margin: 0; padding: 6px 8px 40px;
      background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--t-r-lg);
      font: 12px/1.45 var(--font-mono);
      user-select: text; -webkit-user-select: text; cursor: text;
      contain: content;
    }
    .log-row {
      display: grid;
      grid-template-columns: 84px 48px 48px minmax(0, 1fr);
      column-gap: var(--space-2); align-items: baseline;
      padding: 2px var(--space-1); border-bottom: .5px solid var(--line);
      min-width: 0;
    }
    .log-row[hidden] { display: none; }   /* display:grid 会盖掉 UA 的 [hidden] */
    .log-row > span { min-width: 0; }
    .log-time { color: var(--muted); font-variant-numeric: var(--numeric-tabular); white-space: nowrap; }
    .log-level { font-weight: 700; letter-spacing: .02em; }
    .log-cat { color: var(--t-fg-accent); font-size: 11px; letter-spacing: .02em; text-transform: lowercase; }
    .log-msg { color: var(--fg); overflow-wrap: anywhere; white-space: pre-wrap; }
    /* 只染级别列，正文保持原色：整行刷红会让一屏日志没法读。 */
    .l-E .log-level { color: var(--err); }
    .l-W .log-level { color: var(--warn); }
    .l-I .log-level { color: var(--fg); }
    .l-D .log-level { color: var(--muted); }
    .l-X .log-level { color: var(--err); }
    .log-empty { padding: 8px var(--space-1); color: var(--muted); }
    mark.hit { background: var(--t-hit); color: var(--t-fg); border-radius: var(--t-r-xs); }
    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      background: var(--t-toast-bg); border: 1px solid var(--line); color: var(--t-on-accent);
      padding: 6px 14px; border-radius: var(--t-r-pill); font-size: 11px; opacity: 0;
      transition: opacity .18s; pointer-events: none; white-space: nowrap;
      max-width: 92%; overflow: hidden; text-overflow: ellipsis;
    }
    .toast.show { opacity: 1; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
  </style>
</head>
<body>
  <header>
    <b id="hd-title" data-i18n="logs.title">Logs</b>
    <div class="row">
      <select id="sel-file" size="1"></select>
      <select id="sel-lines" size="1" data-i18n-title="logs.lines" title="Lines to read">
        <option value="200">200</option>
        <option value="500">500</option>
        <option value="1000">1000</option>
        <option value="2000">2000</option>
        <option value="5000">5000</option>
      </select>
      <label class="chk"><input type="checkbox" id="chk-auto"><span id="k-auto" data-i18n="logs.auto">Follow</span></label>
      <button id="btn-refresh" data-i18n="logs.refresh">Refresh</button>
      <button id="btn-dir" data-i18n="sett.open_folder">Open folder</button>
      <button class="tiny" id="btn-close" data-i18n="sett.close">Close</button>
    </div>
  </header>

  <main>
    <div class="bar" id="level-bar">
      <span class="lbl" data-i18n="logs.filter_level">Level</span>
      <button class="lvl on" data-lvl="all" data-i18n="logs.level_all">All</button>
      <button class="lvl" data-lvl="E" data-i18n="logs.level_error">Error</button>
      <button class="lvl" data-lvl="W" data-i18n="logs.level_warn">Warning</button>
      <button class="lvl" data-lvl="I" data-i18n="logs.level_info">Info</button>
      <button class="lvl" data-lvl="D" data-i18n="logs.level_debug">Debug</button>
    </div>
    <div class="bar" id="cat-bar">
      <span class="lbl" data-i18n="logs.filter_cat">Category</span>
      <button class="lvl on" data-cat="" data-i18n="logs.cat_all">All</button>
      <button class="lvl" data-cat="net" data-i18n="logs.cat_net">Network</button>
      <button class="lvl" data-cat="auto" data-i18n="logs.cat_auto">Automation</button>
      <button class="lvl" data-cat="upd" data-i18n="logs.cat_upd">Update</button>
      <button class="lvl" data-cat="cfg" data-i18n="logs.cat_cfg">Config</button>
      <button class="lvl" data-cat="app" data-i18n="logs.cat_app">App</button>
    </div>
    <div class="bar">
      <input type="text" id="in-filter" data-i18n-placeholder="logs.filter" placeholder="Filter" spellcheck="false">
      <span class="val" id="v-status"></span>
    </div>
    <div class="path" id="p-dir">—</div>
    <div id="out" class="log-body" role="log" aria-live="off"><div id="rows"></div><div id="empty" class="log-empty" hidden></div></div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const hasTauri = () => window.__TAURI__ && window.__TAURI__.core;
    const invoke = (cmd, args) => {
      if (!hasTauri()) return Promise.reject(new Error("no tauri bridge"));
      return window.__TAURI__.core.invoke(cmd, args);
    };
    const el = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    let strings = {};
    const t = (k, d) => strings[k] || d || k;
    const tf = (k, d, vars) =>
      Object.entries(vars || {}).reduce((s, [a, b]) => s.replace("{" + a + "}", b), t(k, d));
    // `<html lang>` 跟着后端走：读屏软件和 CJK 字形选择都看这个属性。
    const syncLang = () => invoke("get_language")
      .then((c) => { document.documentElement.lang = c; })
      .catch(() => {});
    // 配色那一档由后端定：问操作系统的是它一处，四座窗口看到的才是同一份答案，
    // 而 CSS 的 `prefers-color-scheme` 让每座窗口各自解释一遍。`theme.css` 只认这个属性。
    const applyTheme = (k) => { if (k) document.documentElement.dataset.theme = k; };
    const syncTheme = () => invoke("get_theme").then(applyTheme).catch(() => {});

    function toast(msg) {
      const n = el("toast");
      n.textContent = msg; n.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => n.classList.remove("show"), 1800);
    }

    // 界面文案只有一份来源：后端字典（静态标记里的英文是问不到字典时的兜底，
    // 由闸门要求与字典的 en 值逐字一致）。
    function applyI18n() {
      const put = (n, key, set) => { const v = strings[key]; if (v) set(v); };
      for (const n of document.querySelectorAll("[data-i18n]"))
        put(n, n.dataset.i18n, (v) => { n.textContent = v; });
      for (const n of document.querySelectorAll("[data-i18n-placeholder]"))
        put(n, n.dataset.i18nPlaceholder, (v) => n.setAttribute("placeholder", v));
      for (const n of document.querySelectorAll("[data-i18n-title]"))
        put(n, n.dataset.i18nTitle, (v) => n.setAttribute("title", v));
      syncLang();
      renderBody();
    }

    /* —————————————————————— 数据 ——————————————————————
       `body` 存的是后端给的那一段原文，过滤只在显示时做一遍：过滤器改一个字不该
       再去问一次磁盘，而重读会把「已经滚上去看的那一段」换掉。 */
    let files = [];
    let name = "";
    let body = "";
    let shown = 0;      // 本次返回的行数
    let truncated = false;
    let busy = false;
    // 选中的级别筛选（空 = 不过滤）。与后端写入时的 MIN_LEVEL 闸门是两回事：这里是纯显示端，
    // 只对文件里**已有**的行再按严重度收窄（后端设成 Debug 才会把 D 行写进文件）。
    let levelFilter = "";
    // 级别筛选的「最小严重度」映射：选 E 只看错误，W 含错误+警告，I 含前三者，D 全部。
    const LEVEL_MIN = { "": null, "E": ["E"], "W": ["E", "W"], "I": ["E", "W", "I"], "D": ["E", "W", "I", "D"] };
    // 选中的分类筛选（空 = 不过滤）：分级（严重度）之外的第二维度，两维交叉生效 ——
    // 比如「Error × 网络」就是「只看网络层报过错」。
    let catFilter = "";

    function optLabel(f) {
      return f.today ? `${f.name} ${t("logs.today", "(today)")}` : f.name;
    }

    function fillSelect() {
      const sel = el("sel-file");
      sel.innerHTML = files.length
        ? files.map(f => `<option value="${esc(f.name)}">${esc(optLabel(f))}</option>`).join("")
        : `<option value="">${esc(t("logs.no_files", "No log files yet"))}</option>`;
      sel.value = name;
    }

    async function loadFiles(keepName) {
      try {
        const d = await invoke("get_log_files");
        files = d.files || [];
        el("p-dir").textContent = d.log_dir || "—";
        const max = Number(d.max_lines) || 5000;
        const want = Number(el("sel-lines").value) || 500;
        if (want > max) el("sel-lines").value = String(max);
        if (!keepName || !files.some(f => f.name === name)) name = files.length ? files[0].name : "";
        fillSelect();
      } catch (e) { /* 浏览器直接打开时静默：没有后端可问 */ }
    }

    async function readBody() {
      if (!name || busy) return;
      busy = true;
      try {
        const r = await invoke("read_log", { name, lines: Number(el("sel-lines").value) || 500 });
        body = r.text || "";
        shown = Number(r.lines) || 0;
        truncated = !!r.truncated;
      } catch (e) {
        // 读失败必须说出口：这条命令是界面唯一的证据来源，静默的空白会被当成「今天没日志」
        toast(String(e)); body = ""; shown = 0; truncated = false;
      } finally {
        busy = false;
      }
      renderBody();
    }

    /* ——— 解析一次、过滤多次 ———
       旧版每次敲一个过滤字都把整段原文 split、跑两遍正则、再拼几千行 innerHTML。
       5000 行时那是每次按键几千次正则 + 整棵子树重建。现在只在重新读盘时解析一次，
       按键和切筛选都只走缓存好的结构。
       Parse once on disk read; keystrokes and filter toggles only scan cached rows. */
    const LINE_RE = /^\[(\d{4})-(\d{2})-(\d{2}) (\d{2}:\d{2}:\d{2})\] \[(ERROR|WARN|INFO|DEBUG|PANIC)\](?: \[([a-z]{2,4})\])? (.*)$/;
    const LEVEL_SHORT = { ERROR: "E", WARN: "W", INFO: "I", DEBUG: "D", PANIC: "X" };
    let parsed = [];
    let parsedBody = null;

    function parseBody() {
      if (parsedBody === body) return;
      parsedBody = body;
      parsed = (body ? body.split("\n") : []).map((raw) => {
        const m = LINE_RE.exec(raw);
        if (!m) {
          // 旧版本写的行与 panic 行没有分类：按 app 兜底，级别未知（过滤时保留）。
          return { raw, time: "", level: "", cat: "app", msg: raw };
        }
        // 文件按天轮转，文件名自带日期，所以列里只留时分秒 —— 90px 一列放得下。
        return { raw, time: m[4], level: LEVEL_SHORT[m[5]], cat: m[6] || "app", msg: m[7] };
      });
    }

    /* ——— 行节点复用 ———
       只在第一次需要时建节点，之后改文字与 class，不拆 DOM。滚动位置与屏幕阅读器
       的焦点不会因为整棵子树被替换而跳掉。
       Reuse row nodes instead of rebuilding innerHTML on every filter change. */
    const rowHost = el("rows");
    const emptyNode = el("empty");
    const rowPool = [];
    function makeRow() {
      const n = document.createElement("div");
      const time = document.createElement("span"); time.className = "log-time";
      const level = document.createElement("span"); level.className = "log-level";
      const cat = document.createElement("span"); cat.className = "log-cat";
      const msg = document.createElement("span"); msg.className = "log-msg";
      n.append(time, level, cat, msg);
      n._c = { time, level, cat, msg };
      rowHost.appendChild(n);
      return n;
    }
    function fillMsg(node, text, q) {
      node.textContent = "";
      if (!q) { node.textContent = text; return; }
      const i = text.toLowerCase().indexOf(q);
      if (i < 0) { node.textContent = text; return; }
      node.appendChild(document.createTextNode(text.slice(0, i)));
      const hit = document.createElement("mark");
      hit.className = "hit"; hit.textContent = text.slice(i, i + q.length);
      node.appendChild(hit);
      node.appendChild(document.createTextNode(text.slice(i + q.length)));
    }

    function renderBody() {
      parseBody();
      const q = el("in-filter").value.trim().toLowerCase();
      const out = el("out");
      const atBottom = out.scrollHeight - out.scrollTop - out.clientHeight < 40;
      const allowed = LEVEL_MIN[levelFilter];
      // 级别/分类筛选与子串过滤交叉生效；无法识别级别的辅助行在过滤时保留，
      // 分类缺失的旧行按 app 兜底 —— 与后端「归不进其余四层的都算应用层」同一条规则。
      const kept = parsed.filter(r =>
        (!q || r.raw.toLowerCase().includes(q)) &&
        (!allowed || !r.level || allowed.includes(r.level)) &&
        (!catFilter || r.cat === catFilter));

      while (rowPool.length < kept.length) rowPool.push(makeRow());
      for (let i = 0; i < rowPool.length; i++) {
        const n = rowPool[i];
        if (i >= kept.length) { n.hidden = true; continue; }
        n.hidden = false;
        const r = kept[i];
        const cls = r.level ? "log-row l-" + r.level : "log-row";
        if (n.className !== cls) n.className = cls;
        const c = n._c;
        if (c.time.textContent !== r.time) c.time.textContent = r.time;
        if (c.level.textContent !== r.level) c.level.textContent = r.level;
        if (c.cat.textContent !== r.cat) c.cat.textContent = r.cat;
        // 未变的行不要重刷正文：长日志里绝大多数行在相邻两次过滤之间是同一批。
        if (n._msgRaw !== r.msg || n._msgQ !== q) {
          n._msgRaw = r.msg; n._msgQ = q;
          fillMsg(c.msg, r.msg, q);
        }
      }
      emptyNode.hidden = kept.length > 0;
      if (kept.length === 0) emptyNode.textContent = t("logs.empty", "Nothing to show");
      el("v-status").textContent = q
        ? tf("logs.showing", "{shown} of {total} lines", { shown: kept.length, total: shown })
        : tf("logs.read", "{total} lines", { total: shown })
          + (truncated ? " · " + t("logs.truncated", "older lines not read") : "");
      // 「跟随」的整个意义就是看见最新一行，所以只有本来就贴着底部时才自动滚。
      if (el("chk-auto").checked || atBottom) out.scrollTop = out.scrollHeight;
    }

    // 连续输入合并到下一帧：一秒敲十个字不会画十次 5000 行。
    let renderQueued = false;
    function requestRender() {
      if (renderQueued) return;
      renderQueued = true;
      requestAnimationFrame(() => { renderQueued = false; renderBody(); });
    }

    /* —————————————————————— 交互 —————————————————————— */
    el("sel-file").onchange = (ev) => { name = ev.target.value; body = ""; renderBody(); readBody(); };
    el("sel-lines").onchange = () => readBody();
    el("in-filter").oninput = () => requestRender();
    el("chk-auto").onchange = (ev) => { if (ev.target.checked) readBody(); };
    el("btn-refresh").onclick = async () => { await loadFiles(true); await readBody(); };
    el("btn-dir").onclick = () => invoke("open_logs").catch(e => toast(String(e)));
    el("btn-close").onclick = () => invoke("close_log_viewer").catch(() => {});
    // 级别筛选切换：同一时刻只有一颗高亮，点了立即按新级别重画（不重新读盘）。
    document.querySelectorAll("#level-bar .lvl").forEach(b => {
      b.onclick = () => {
        levelFilter = b.dataset.lvl || "";
        document.querySelectorAll("#level-bar .lvl").forEach(x => x.classList.toggle("on", x === b));
        requestRender();
      };
    });
    // 分类筛选切换：与级别筛选独立工作，交叉生效。
    // Category toggle: independent from the level filter, both apply at once.
    document.querySelectorAll("#cat-bar .lvl").forEach(b => {
      b.onclick = () => {
        catFilter = b.dataset.cat || "";
        document.querySelectorAll("#cat-bar .lvl").forEach(x => x.classList.toggle("on", x === b));
        requestRender();
      };
    });

    // 每 2.5 秒问一次，但只在窗口真的看得见、且用户勾了「自动」时才问。关掉窗口
    // 只是隐藏（这个进程会一直活着），所以看不见的时候把定时器**停掉**，而不是
    // 留它每两秒醒一次再 return —— 一个常年挂在后台的日志窗口那样白烧 CPU，
    // 十几个标签页开着就是十几个。回到前台时立刻补读一次：停摆的这段时间里
    // 日志已经长出新行了，让用户盯着旧内容等下一个 2.5 秒没有意义。
    let pollTimer = null;
    const stopPolling = () => {
      if (pollTimer == null) return;
      clearInterval(pollTimer);
      pollTimer = null;
    };
    const startPolling = () => {
      if (pollTimer != null) return;
      pollTimer = setInterval(() => {
        if (!el("chk-auto").checked || document.hidden) return;
        loadFiles(true).then(readBody);
      }, 2500);
    };
    startPolling();
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) { stopPolling(); return; }
      startPolling();
      if (el("chk-auto").checked) loadFiles(true).then(readBody);
    });

    // 语言在软件设置里改；这个窗口开着的时候改了，就得当下跟着换口径。
    // 配色同理，但它还要多防一手：选了「跟随系统」时操作系统可能自己换档（日落后），
    // 而广播只在引擎有动静时才来 —— 被点开的这一刻对一次色，用户看到的才是当下的系统。
    window.addEventListener("focus", syncTheme);
    let langShown = null;
    async function syncLanguage(code) {
      if (!code || code === langShown) return;
      langShown = code;
      try { strings = await invoke("get_strings"); } catch (e) { return; }
      applyI18n();
      fillSelect();
    }
    if (window.__TAURI__ && window.__TAURI__.event) {
      window.__TAURI__.event.listen("netsense://status", (e) => {
        const p = typeof e.payload === "string" ? JSON.parse(e.payload) : e.payload;
        if (p) { syncLanguage(p.language); applyTheme(p.theme); }
      });
    }

    (async () => {
      syncTheme();
      try { strings = await invoke("get_strings"); } catch (e) {}
      applyI18n();
      await loadFiles(false);
      await readBody();
      // 就绪心跳：init 全部跑完才发。「界面全白」在文件日志里是隐形的，这条心跳让
      // 下一次白屏能用「日志里有没有 ready」一步分辨 JS 没跑还是画不出来。
      // Readiness heartbeat, sent only after init fully completes: blank-window
      // failures are invisible in the file log, and this line splits the next one
      // into "scripts never ran" vs "ran but failed to paint" in a single step.
      invoke("frontend_ready", { win: "logs" }).catch(() => {});
    })();
  </script>
</body>
</html>
