<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>NetSense</title>
  <style>
    :root {
      --bg-main: #121212; --bg-panel: #1e1e1e; --bg-input: #2d2d2d;
      --border-color: #383838; --text-main: #e0e0e0; --text-label: #aaaaaa;
      --text-accent: #64B5F6; --btn-primary: #1976D2; --btn-danger: #D32F2F;
      --btn-warning: #E65100; --radius-md: 8px; --radius-sm: 4px;
      --ok: #4CAF50; --warn: #FFB300; --err: #ef5350; --off: #7a7a7a;
    }
    body {
      background-color: var(--bg-main); color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      margin: 0; padding: 8px; font-size: 12px; user-select: none; overflow: hidden;
    }
    /* 三层：当前状态条 / 四列编辑区 / 命令按钮。
       第一层的四格与第二层的四列用**同一套** grid-template-columns，所以每一格正好压在
       它所说的那一列上面 —— 状态与编辑区一一对应，用户不需要在两个地方找同一个东西。 */
    .wrap { display: flex; flex-direction: column; gap: 8px; height: calc(100vh - 16px); }
    .strip, .cols {
      display: grid; grid-template-columns: 215px repeat(3, minmax(0, 1fr)); gap: 8px;
    }
    .strip { flex: none; }
    .cols { flex: 1; min-height: 0; }
    .cell {
      background: var(--bg-panel); border: 1px solid var(--border-color);
      border-radius: var(--radius-md); padding: 6px 8px; max-height: 132px;
      overflow-y: auto; min-height: 0;
    }
    .cell-k {
      font-size: 10px; color: var(--text-accent); text-transform: uppercase;
      letter-spacing: 1px; font-weight: 700; margin-bottom: 3px;
    }
    .panel {
      background: var(--bg-panel); border: 1px solid var(--border-color);
      border-radius: var(--radius-md); display: flex; flex-direction: column; overflow: hidden;
      min-height: 0;
    }
    .panel-header {
      padding: 8px 10px; border-bottom: 1px solid var(--border-color);
      font-weight: bold; font-size: 12px; display: flex; justify-content: space-between;
      align-items: center; gap: 6px; flex: none;
    }
    .panel-content { padding: 10px; flex: 1; overflow-y: auto; min-height: 0; }
    .panel-content.pad0 { padding: 0; }
    .rowhead { display: flex; align-items: center; gap: 6px; }
    /* Profile 行：勾选框、名字、状态、快速切换勾选全在一行；选中行把名字换成输入框 */
    .prow {
      padding: 5px 8px; cursor: pointer; border-bottom: 1px solid var(--border-color);
      border-left: 3px solid transparent; font-size: 12px;
      display: flex; align-items: center; gap: 6px;
    }
    .prow:hover { background: #2a2a2a; }
    .prow.active { background: #1565C0; color: #fff; }
    .prow.active .badge-slot .b-active { background: #0d3d1a; }
    /* 生效中的那一条：绿色描边。它和「选中」是两件事，可以同时出现。 */
    .prow.live { border-left-color: var(--ok); background: rgba(76, 175, 80, .10); }
    .prow.live.active { border-left-color: var(--ok); background: #14562b; }
    .prow.dirty .li-name::after { content: " ●"; color: var(--warn); }
    .li-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .li-name.in { min-width: 0; }
    .li-off { opacity: .55; }
    .badge-slot { display: flex; align-items: center; }
    .group-title {
      font-size: 11px; color: var(--text-accent); margin: 10px 0 5px 0;
      padding-bottom: 3px; border-bottom: 1px dashed #333; font-weight: bold;
      display: flex; justify-content: space-between; align-items: center; gap: 6px;
    }
    .group-title:first-child { margin-top: 0; }
    /* 分支标题（THEN / ELSE）：本列先 THEN 后 ELSE，与执行顺序一致 */
    .branch-title {
      margin: 12px 0 6px; padding: 3px 7px; border-radius: var(--radius-sm);
      background: #26262a; color: #cfe3ff; font-size: 11px; font-weight: 700;
      letter-spacing: .3px;
    }
    .branch-title:first-child { margin-top: 0; }
    .branch-title.else { color: #d6d6dc; }
    .form-group { margin-bottom: 5px; display: grid; grid-template-columns: 84px 1fr; gap: 6px; align-items: center; }
    label { color: var(--text-label); font-size: 11px; text-align: right; line-height: 1.2; }
    input, select, textarea {
      background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main);
      padding: 3px 5px; border-radius: var(--radius-sm); font-size: 11px; width: 100%; box-sizing: border-box;
      font-family: inherit;
    }
    input[type=checkbox] { width: auto; }
    input:focus, select:focus, textarea:focus { border-color: var(--btn-primary); outline: none; }
    textarea { resize: vertical; min-height: 90px; font-family: ui-monospace, Menlo, monospace; }
    .hint { color: #7a7a7a; font-size: 10px; line-height: 1.35; margin: 2px 0 6px; }
    .card {
      border: 1px solid var(--border-color); border-radius: var(--radius-sm);
      padding: 5px 6px; margin-bottom: 5px; background: rgba(255,255,255,.02);
    }
    .card-head { display: flex; justify-content: space-between; align-items: center; gap: 4px; margin-bottom: 4px; }
    .card-title { font-size: 10px; color: #FFD54F; font-weight: bold; overflow: hidden;
                  text-overflow: ellipsis; white-space: nowrap; }
    .kv { display: flex; justify-content: space-between; gap: 6px; font-size: 10px; line-height: 1.7; }
    .kv .k { color: var(--text-label); flex: none; }
    .kv .v { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex;
             align-items: center; gap: 4px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    .grid2 > .full { grid-column: 1 / -1; }
    .mini-btn {
      background: #333; color: #cfcfcf; border: 1px solid var(--border-color);
      border-radius: var(--radius-sm); font-size: 9px; padding: 1px 5px; cursor: pointer; flex: none;
    }
    .mini-btn:hover { background: #444; color: #fff; }
    .empty { color: #777; font-size: 10px; padding: 4px 0; }
    .switch { display: flex; align-items: center; gap: 6px; font-size: 11px; margin-bottom: 6px; }
    .switch.inline { margin: 0; }
    .switch label, .switch span { text-align: left; color: var(--text-main); }
    /* 条件行：勾选框、类型、值、状态、删除，全部一行 */
    .crow { display: flex; align-items: center; gap: 4px; margin-bottom: 4px; }
    .crow .ct { flex: 0 0 106px; min-width: 0; }
    .crow .cv { flex: 1 1 auto; min-width: 0; }
    /* 三态徽标：条件 / 规则 / Profile 共用一套 */
    .badge {
      font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 999px;
      background: #2f3640; color: var(--off); letter-spacing: .3px; flex: none;
    }
    .b-match { background: #1d3a22; color: #6ee08a; }
    .b-nomatch { background: #3a2020; color: #ff9d9d; }
    .b-inactive { background: #34343a; color: #9a9aa4; }
    .b-active { background: #14562b; color: #b7f5cb; }
    .b-conflict { background: #4a3410; color: #ffd27f; }
    .b-error { background: #4a1515; color: #ffb0b0; }
    .b-dim { background: #26262a; color: #8e8e97; }
    /* 动作级实时状态：一条 3B1 动作跑完（或超时）就换一个色，
       用户据此知道是哪一条卡住了，而不是整批一个「失败」 */
    .achip { font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 999px;
      background: #2f3640; color: var(--off); letter-spacing: .3px; flex: none; }
    .achip:empty { display: none; }
    .achip.ok { background: #1d3a22; color: #6ee08a; }
    .achip.bad { background: #4a1515; color: #ffb0b0; }
    .achip.run { background: #4a3410; color: #ffd27f; }
    /* 失败原因摊在动作行下面：只进 toast 或 title 的话，用户一眨眼就没了，
       而这正是他要拿去排障的那句话 */
    .aerr { color: #ffb0b0; font-size: 10px; margin-top: 3px; word-break: break-word; }
    .rule-box { border-left: 3px solid #3a3a3a; }
    .rule-box.r-match { border-left-color: var(--ok); }
    .rule-box.r-nomatch { border-left-color: var(--err); }
    .rule-box.r-inactive { border-left-color: #4a4a4a; }
    .btn-group {
      padding: 8px 10px; border-top: 1px solid var(--border-color);
      display: flex; justify-content: flex-end; gap: 8px; flex: none;
      background: var(--bg-panel); border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
    }
    button {
      background: var(--btn-primary); color: #fff; border: none; padding: 5px 12px;
      border-radius: var(--radius-sm); cursor: pointer; font-size: 11px;
    }
    button:hover { opacity: .9; }
    button.danger { background: var(--btn-danger); }
    button.warning { background: var(--btn-warning); }
    button.secondary { background: #4a4a4a; color: #ccc; }
    button.ghost { background: #333; color: #cfcfcf; border: 1px solid var(--border-color); }
    .banner {
      background: #4a3410; color: #ffd27f; border: 1px solid #6b4c14;
      border-radius: var(--radius-sm); padding: 6px 10px; font-size: 11px; flex: none;
    }
    .banner.info { background: #1b2432; color: #8ea3c0; border-color: #263449; }
    .banner[hidden] { display: none; }
    #toast {
      position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
      background: rgba(0,0,0,.85); border: 1px solid var(--border-color); color: #fff;
      padding: 6px 14px; border-radius: 999px; font-size: 11px; opacity: 0;
      transition: opacity .2s; pointer-events: none; max-width: 92vw; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }
    #toast.show { opacity: 1; }
    .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.55);
      display: flex; align-items: center; justify-content: center; z-index: 50; }
    .modal-mask[hidden] { display: none; }
    .modal { width: 400px; max-width: 92%; background: var(--bg-panel);
      border: 1px solid var(--border-color); border-radius: 10px; padding: 14px; }
    .modal.wide { width: 520px; max-height: 86vh; overflow-y: auto; }
    .modal h3 { margin: 0 0 8px; font-size: 13px; }
    .modal .mv { font-size: 11px; color: var(--text-label); line-height: 1.5; }
    .modal ul { margin: 8px 0; padding-left: 18px; font-size: 12px; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
  </style>
</head>
<body>

<div class="wrap">
  <div class="banner" id="conflict-bar" hidden></div>

  <!-- 第一层：当前状态。四格与下面四列一一对应。 -->
  <div class="strip">
    <div class="cell"><div class="cell-k" id="sk-1" data-i18n="editor.state_active_profile">Active profile</div><div class="cell-v" id="st-profile"></div></div>
    <div class="cell"><div class="cell-k" id="sk-2" data-i18n="editor.state_conditions">Why it matched</div><div class="cell-v" id="st-cond"></div></div>
    <div class="cell"><div class="cell-k" id="sk-3" data-i18n="editor.state_network">Current network</div><div class="cell-v" id="st-net"></div></div>
    <div class="cell"><div class="cell-k" id="sk-4" data-i18n="editor.state_actions">What it runs</div><div class="cell-v" id="st-act"></div></div>
  </div>

  <!-- 第二层：四列编辑区。列序 = 决策链的顺序：选哪套配置 → 靠什么条件 → 3A 网络 → 3B 动作。 -->
  <div class="cols">
    <div class="panel">
      <div class="panel-header">
        <span id="hdr-profiles" data-i18n="editor.profiles_column">Profiles</span>
        <span class="rowhead"><span id="obj-badge"></span><button class="mini-btn" id="btn-new" data-i18n="editor.new_profile">+ New</button></span>
      </div>
      <div class="panel-content pad0" id="col-profiles"></div>
    </div>

    <div class="panel">
      <div class="panel-header"><span id="hdr-cond" data-i18n="editor.conditions_column">Match Conditions</span></div>
      <div class="panel-content" id="col-cond"></div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <span id="hdr-net" data-i18n="editor.network_title">3A · Network configuration</span>
        <button class="mini-btn" id="btn-verify" data-act="open-verify" data-i18n="editor.verify_button">Verify</button>
      </div>
      <div class="panel-content" id="col-net"></div>
    </div>

    <div class="panel">
      <div class="panel-header"><span id="hdr-act" data-i18n="editor.automation_column">Automation Actions</span></div>
      <div class="panel-content" id="col-act"></div>
    </div>
  </div>

  <!-- 第三层：命令。 -->
  <div class="btn-group">
    <button class="warning" id="btn-apply" data-i18n="editor.force_apply">▶ Apply now</button>
    <button class="danger" id="btn-delete" data-i18n="editor.delete">Delete</button>
    <button id="btn-save" data-i18n="editor.save">Save</button>
    <button class="secondary" id="btn-close" data-i18n="editor.close">Close</button>
  </div>
</div>

<div id="toast"></div>
<div class="modal-mask" id="conflict-mask" hidden>
  <div class="modal" id="conflict-modal"></div>
</div>
<div class="modal-mask" id="apply-mask" hidden>
  <div class="modal" id="apply-modal"></div>
</div>
<div class="modal-mask" id="verify-mask" hidden>
  <div class="modal wide" id="verify-modal"></div>
</div>
<div class="modal-mask" id="del-mask" hidden>
  <div class="modal" id="del-modal"></div>
</div>

<script>
  const hasTauri = () => window.__TAURI__ && window.__TAURI__.core;
  const invoke = (cmd, args) => {
    if (!hasTauri()) return Promise.reject(new Error("no tauri bridge"));
    return window.__TAURI__.core.invoke(cmd, args);
  };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  let strings = {};
  const t = (k, vars) => {
    let s = strings[k] || k;
    if (vars) for (const key in vars) s = s.split("{" + key + "}").join(vars[key]);
    return s;
  };
  const clone = (o) => JSON.parse(JSON.stringify(o ?? null));
  // `<html lang>` 跟着后端走：读屏软件和 CJK 字形选择都看这个属性。
  const syncLang = () => invoke("get_language")
    .then((c) => { document.documentElement.lang = c; })
    .catch(() => {});
  let _seq = 0;
  const uid = (p) => p + Date.now().toString(36).slice(-5) + (_seq++).toString(36);
  const num = (v, d) => { const n = Number(v); return Number.isFinite(n) && n >= 0 ? n : d; };

  // ———————— NIC helpers (mirrors popup.html) ————————
  const kindLabel = (kind) => kind === "wireless" ? t("popup.kind_wireless", "Wi-Fi")
    : kind === "wired" ? t("popup.kind_wired", "Wired")
    : kind === "vpn" ? t("popup.kind_vpn", "VPN") : t("popup.kind_other", "Other");

  const nicTitle = (n) => {
    const label = (n.label || "").trim();
    if (!label) return `${n.name} (${kindLabel(n.kind)})`;
    return label.toLowerCase().includes(n.name.toLowerCase())
      ? label : `${n.name} (${label})`;
  };

  /* —————————————————————— 状态 ——————————————————————
     `draft` 与磁盘上的配置刻意分成两份：引擎广播可能几秒就来一次，
     若每次都把表单重建一遍，用户正在输入的内容会被吞掉。
     所以广播只更新状态条、徽标与按钮；表单只在切换选中项、增删条目或保存成功时重建。 */
  let cfg = { schema: 1, profiles: [], fallback: null, allowed_scripts: [] };
  let globalDraft = { fallback: null, allowed_scripts: [] };
  let view = null;      // EngineView：{state, active, conflict, snapshot, profiles, warnings, last_run, workers}
  let wifiList = [];    // 系统已保存的 SSID —— SSID 条件值的候选
  let nicList = [];     // 系统硬件网卡（get_interfaces）—— 接口条件值的候选
  let printerList = []; // 系统打印机（[{name, is_default}]）—— 默认打印机动作的候选
  let sel = null;       // { kind: 'profile' | 'fallback', id }
  let draft = null;     // 选中 Profile 的可编辑副本
  let dirty = false;
  let langShown = null; // 界面上现在显示的是哪种语言
  let verifyOpen = false;

  function toast(msg) {
    const el = $("toast");
    el.textContent = msg; el.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove("show"), 2400);
  }

  /* —————————————————————— 路径读写（data-bind） —————————————————————— */
  function getPath(root, path) {
    return path.split(".").reduce((o, k) => {
      if (o == null) return undefined;
      return Array.isArray(o) ? o[Number(k)] : o[k];
    }, root);
  }
  function setPath(root, path, value) {
    const parts = path.split(".");
    let o = root;
    for (let i = 0; i < parts.length - 1; i++) {
      const k = parts[i];
      if (Array.isArray(o)) { o = o[Number(k)]; }
      else if (o[k] === undefined) o[k] = /^\d+$/.test(parts[i + 1]) ? [] : {};
      else o = o[k];
      if (o == null) return;
    }
    const last = parts[parts.length - 1];
    if (value === undefined || value === "") delete o[last]; else o[last] = value;
    dirty = true;
  }
  /// data-bind 的根对象随选中项而变：Profile → 它的副本；兜底 → 全局 fallback 对象。
  function editRoot() {
    if (!sel) return null;
    if (sel.kind === "profile") return draft;
    return (globalDraft.fallback ||= { enabled: true });
  }
  /// 分支前缀直接写在绑定路径里（`then.` / `else.` / 兜底用空串），所以这里不存在
  /// 「当前分支」这种隐藏状态：两分支的表单同时呈现在同一列里，谁也不依赖谁被选中。
  function scope(pre) {
    const root = editRoot();
    if (!root) return {};
    if (pre === "") return root;
    return (root[pre.slice(0, -1)] ||= {});
  }
  const BRANCHES = () => (sel && sel.kind === "profile" ? ["then.", "else."] : [""]);
  const branchTitle = (pre) =>
    pre === "then." ? "editor.then" : pre === "else." ? "editor.else_branch" : "editor.global_fallback";

  /* —————————————————————— 引擎视图查询 —————————————————————— */
  const profileView = (id) => (view && view.profiles || []).find(p => p.id === id) || null;
  function ruleView(pid, rid) {
    const p = profileView(pid);
    return p && (p.rules || []).find(r => r.id === rid) || null;
  }
  const BADGE = {
    match: ["b-match", "editor.status_match"],
    no_match: ["b-nomatch", "editor.status_nomatch"],
    inactive: ["b-inactive", "editor.status_inactive"],
    active: ["b-active", "editor.status_active"],
    not_matched: ["b-dim", "editor.status_not_matched"],
    disabled: ["b-dim", "editor.status_disabled"],
    conflict: ["b-conflict", "editor.status_conflict"],
    error: ["b-error", "editor.status_error"],
  };
  const badge = (key) => {
    const m = BADGE[key];
    return m ? `<span class="badge ${m[0]}">${esc(t(m[1]))}</span>` : "";
  };
  /// 引擎当前的判定指向哪个 Profile（Active 才有）。
  function activeId() {
    const st = view && view.state;
    return st && st.state === "active" ? st.id : null;
  }
  const savedProfile = (id) => (cfg.profiles || []).find(p => p.id === id) || null;
  const nameOf = (id) => { const p = savedProfile(id); return p ? (p.name || p.id) : id; };

  /* —————————————————————— 表单控件 —————————————————————— */
  const txt = (path, val, ph) =>
    `<input type="text" value="${esc(val ?? "")}" placeholder="${esc(ph || "")}" data-bind="${path}">`;
  const int = (path, val, ph) =>
    `<input type="number" min="0" value="${esc(val ?? "")}" placeholder="${esc(ph || "")}" data-bind="${path}" data-cast="int">`;
  const chk = (path, val, labelKey, cls) =>
    `<label class="switch ${cls || ""}"><input type="checkbox" data-bind="${path}" data-cast="bool" ${val ? "checked" : ""}>` +
    `<span>${esc(t(labelKey))}</span></label>`;
  const sel_ = (path, val, options) =>
    `<select data-bind="${path}">` + options.map(([v, label]) =>
      `<option value="${esc(v)}" ${String(val ?? "") === String(v) ? "selected" : ""}>${esc(label)}</option>`).join("") +
    `</select>`;
  const row = (labelKey, control) =>
    `<div class="form-group"><label>${esc(t(labelKey))}</label>${control}</div>`;
  const row2 = (labelKey, control) =>
    `<div style="display:flex;align-items:center;gap:4px;"><label style="flex:none;">${esc(t(labelKey))}</label>${control}</div>`;
  const lst = (path, val, ph) =>
    `<input type="text" value="${esc((val || []).join(" "))}" placeholder="${esc(ph || "")}" data-bind="${path}" data-cast="list">`;
  const pre_ = (pre, rest) => (pre === "" ? rest : pre + rest);

  const COND_TYPES = () => [["wifi_ssid", t("editor.match_ssid")], ["gateway_mac", t("editor.match_gateway_mac")],
    ["bssid", t("editor.match_bssid")], ["network_interface", t("editor.match_interface")]];
  const COND_PH = { wifi_ssid: "Office_5G", gateway_mac: "aa:bb:cc:dd:ee:ff", bssid: "00:11:22:33:44:55" };

  /// 系统硬件网络出口：条件比的是「在用的普通网卡」，VPN 隧道不是出口，不能选。
  const ifaceNames = () => nicList
    .filter(n => n && n.name && n.kind !== "vpn")
    .map(n => nicTitle(n));

  /* —————————————————————— 第一层：当前状态条 —————————————————————— */
  function renderStrip() {
    const aid = activeId();
    const ap = aid ? profileView(aid) : null;

    // 格 1：生效的那一套配置叫什么
    let p1;
    const st = view && view.state;
    if (!st) p1 = `<span class="empty">${esc(t("editor.loading_status"))}</span>`;
    else if (st.state === "conflict")
      p1 = `${badge("conflict")} <span class="li-name">${esc(t("status.conflict", { names: (st.ids || []).map(nameOf).join(", ") }))}</span>`;
    else if (aid) p1 = `${badge(ap && ap.status)} <b>${esc(nameOf(aid))}</b>`;
    else p1 = `${badge("not_matched")} <span>${esc(t("status.no_profile"))}</span>`;
    $("st-profile").innerHTML = p1;

    // 格 2：它是靠哪些条件生效的
    let p2 = "";
    if (aid && ap) {
      const saved = savedProfile(aid) || {};
      for (const r of (saved.rules || [])) {
        const rv = (ap.rules || []).find(x => x.id === r.id);
        if (!rv || rv.status !== "match") continue;
        for (const c of (r.conditions || [])) {
          if (c.enabled === false) continue;
          p2 += `<div class="kv"><span class="k">${esc(t(condLabel(c.type)))}</span><span class="v">${esc(c.value || "—")}</span></div>`;
        }
      }
    }
    $("st-cond").innerHTML = p2 || `<span class="empty">${esc(t("editor.state_none"))}</span>`;

    // 格 3：当前网络信息。条件值从这里取，而不是让用户手抄 MAC。
    // 与托盘面板同一套字段、同一顺序：iface → SSID → signal → mac → IPv4 → netmask → gateway → IPv6 → DNS
    const primary = nicList[0] || null;
    const s = (view && view.snapshot) || {};
    const wireless = !primary || primary.kind === "wireless";
    const ssid = s.ssid || (primary && primary.ssid) || "";
    const ssidDisplay = ssid || t("status.ssid_unknown");
    
    const rows = [];
    // Interface（总是显示）
    if (primary) {
      rows.push([t("popup.interface"), nicTitle(primary), "network_interface", primary.name]);
    } else if (s.primary_interface) {
      rows.push([t("popup.interface"), s.primary_interface, "network_interface", s.primary_interface]);
    }
    // SSID（无线才显示具体值，有线时留空行占位）
    rows.push([t("status.ssid"), wireless ? ssidDisplay : "", "wifi_ssid", wireless ? s.ssid : undefined]);
    // Signal strength（仅无线且有 RSSI 时显示）
    if (wireless && s.rssi != null) {
      rows.push([t("popup.signal"), s.rssi + " dBm"]);
    }
    // MAC
    if (primary && primary.mac) {
      rows.push([t("popup.mac"), primary.mac, "bssid", primary.mac]);
    } else if (s.bssid) {
      rows.push([t("popup.mac"), s.bssid, "bssid", s.bssid]);
    }
    // IPv4
    const ipv4 = s.ipv4 || (primary && primary.ipv4);
    if (ipv4) rows.push([t("popup.ip"), ipv4]);
    // Netmask
    const netmask = (primary && primary.netmask) || s.netmask;
    if (netmask) rows.push([t("popup.netmask"), netmask]);
    // Gateway
    const gateway = s.gateway || (primary && primary.gateway);
    if (gateway) rows.push([t("popup.gateway"), gateway, "gateway_mac", s.gateway_mac || (primary && primary.gateway_mac)]);
    // IPv6
    if (primary && primary.ipv6) rows.push([t("popup.ipv6"), primary.ipv6]);
    // DNS
    const dns = s.dns || (primary && primary.dns);
    if (dns) rows.push([t("popup.dns"), dns]);
    
    let p3 = rows.map(([k, v, type, canUse]) => {
      const hasValue = v !== undefined && v !== null && v !== "";
      if (!hasValue && k !== t("status.ssid")) return "";
      return `<div class="kv"><span class="k">${esc(k)}</span><span class="v">${esc(v || "—")}` +
        (canUse ? `<button class="mini-btn" data-act="use-cond" data-type="${type}" data-val="${esc(canUse)}">${esc(t("editor.use_value"))}</button>` : "") +
        `</span></div>`;
    }).filter(Boolean).join("");
    
    // 附加信息：所有网卡名列表 + VPN 隧道
    if ((s.interfaces || []).length)
      p3 += `<div class="kv"><span class="k">${esc(t("editor.hardware_column"))}</span><span class="v">${esc(s.interfaces.join(", "))}</span></div>`;
    if ((s.tunnels || []).length)
      p3 += `<div class="kv"><span class="k">${esc(t("editor.nic_vpn"))}</span><span class="v">${esc(s.tunnels.join(", "))}</span></div>`;
    $("st-net").innerHTML = p3 || `<span class="empty">${esc(t("editor.loading_status"))}</span>`;

    // 格 4：生效方案的 THEN 此刻在跑什么（3B1 的结果 + 3B2 的维持状态）
    const lr = view && view.last_run;
    const shown = lr && aid && lr.profile_id === aid ? lr : null;
    const saved = aid ? (savedProfile(aid) || {}) : {};
    const th = saved.then || {};
    let p4 = "";
    for (const a of (th.one_shot || [])) {
      const o = shown && (shown.outcomes || []).find(x => x.id === a.id);
      const cls = o ? (o.ok ? "ok" : "bad") : (shown && shown.running && a.enabled !== false ? "run" : "");
      const txtv = o ? (o.ok ? t("editor.action_ok") : t("editor.action_failed"))
        : (cls === "run" ? t("editor.action_running") : "");
      p4 += `<div class="kv"><span class="k">${esc(actionWord(a))}</span><span class="v">${esc(actionTarget(a))}` +
        `<span class="achip ${cls}">${esc(txtv)}</span></span></div>`;
    }
    for (const w of (view && view.workers) || []) {
      const [key, cls] = WORKER_STATE[w.state] || WORKER_STATE.pending;
      p4 += `<div class="kv"><span class="k">${esc(t("popup.workers"))}</span><span class="v">${esc(w.label || "")}` +
        `<span class="achip ${cls}">${esc(t(key))}</span></span></div>`;
    }
    $("st-act").innerHTML = p4 || `<span class="empty">${esc(t("editor.state_none"))}</span>`;
  }

  const condLabel = (type) => ({
    wifi_ssid: "editor.match_ssid", gateway_mac: "editor.match_gateway_mac",
    bssid: "editor.match_bssid", network_interface: "editor.match_interface",
  }[type] || "editor.match_ssid");

  /* —————————————————————— 第 1 列：Profile 列表 —————————————————————— */
  function renderProfiles() {
    let html = "";
    for (const p of cfg.profiles) {
      const on = sel && sel.kind === "profile" && sel.id === p.id;
      const src = on && draft ? draft : p;
      const pv = profileView(p.id);
      const en = on
        ? `<input type="checkbox" data-bind="enabled" data-cast="bool" ${src.enabled !== false ? "checked" : ""} title="${esc(t("editor.enabled"))}">`
        : `<input type="checkbox" data-row-en="${esc(p.id)}" ${src.enabled !== false ? "checked" : ""} title="${esc(t("editor.enabled"))}">`;
      const quick = on
        ? `<input type="checkbox" data-bind="quick" data-cast="bool" ${src.quick !== false ? "checked" : ""} title="${esc(t("editor.quick"))}">`
        : `<input type="checkbox" data-row-quick="${esc(p.id)}" ${src.quick !== false ? "checked" : ""} title="${esc(t("editor.quick"))}">`;
      const name = on
        ? `<input type="text" class="li-name in" data-bind="name" value="${esc(src.name || "")}">`
        : `<span class="li-name ${src.enabled === false ? "li-off" : ""}">${esc(p.name || p.id)}</span>`;
      html += `<div class="prow ${on ? "active" : ""} ${pv && pv.status === "active" ? "live" : ""} ${on && dirty ? "dirty" : ""}" id="prow-${esc(p.id)}" data-act="sel-profile" data-id="${esc(p.id)}">
        ${en}${name}<span class="badge-slot" id="pbadge-${esc(p.id)}">${pv ? badge(pv.status) : ""}</span>${quick}</div>`;
    }
    // 兜底：一条「特殊的 Profile」。它没有条件 —— 条件区为空就是「任意条件」，
    // 也就是零命中时才走它，所以它永远不参与匹配与冲突判定。
    const fon = sel && sel.kind === "fallback";
    const fb = globalDraft.fallback;
    html += `<div class="prow fb ${fon ? "active" : ""} ${fon && dirty ? "dirty" : ""}" data-act="sel-fallback">
      ${fon
        ? `<input type="checkbox" data-bind="enabled" data-cast="bool" ${!fb || fb.enabled !== false ? "checked" : ""} title="${esc(t("editor.enabled"))}">`
        : `<input type="checkbox" data-row-fb-en="1" ${!fb || fb.enabled !== false ? "checked" : ""} title="${esc(t("editor.enabled"))}">`}
      <span class="li-name ${fb && fb.enabled === false ? "li-off" : ""}">${esc(t("editor.global_fallback"))}</span>
      <span class="badge-slot"></span><span style="width:13px"></span></div>`;
    $("col-profiles").innerHTML = html;
    $("obj-badge").innerHTML = sel && sel.kind === "profile"
      ? badge((profileView(draft.id) || {}).status) : "";
  }

  function refreshBadges() {
    for (const p of cfg.profiles) {
      const slot = $("pbadge-" + p.id);
      const pv = profileView(p.id);
      if (slot) slot.innerHTML = pv ? badge(pv.status) : "";
      // 绿框和徽标是同一份事实，所以也必须一起跟着广播走：只换徽标的话，
      // 列表里「谁正在生效」要到下次整列重绘才对得上。
      const row = $("prow-" + p.id);
      if (row) row.classList.toggle("live", !!pv && pv.status === "active");
    }
    $("obj-badge").innerHTML = sel && sel.kind === "profile"
      ? badge((profileView(draft.id) || {}).status) : "";
  }

  /* —————————————————————— 第 2 列：条件 —————————————————————— */
  /// 名字与「启用」勾选框属于第 1 列的那一行，这里不再重复一遍：同一列里出现两个
  /// 同名控件，用户会以为它们是两件事。
  function renderCondColumn() {
    const box = $("col-cond");
    if (!sel) { box.innerHTML = emptySel(); return; }
    if (sel.kind === "fallback") {
      box.innerHTML = `<div class="group-title">${esc(t("editor.rules_title"))}</div>` +
        `<div class="hint">${esc(t("editor.any_conditions"))}</div>`;
      return;
    }
    const p = draft;
    const d = p.detection ||= { mode: "network_events", change_delay_secs: 5, poll_interval_secs: 30 };
    let html = `<div class="group-title"><span>${esc(t("editor.rules_title"))}</span>` +
      `<button class="mini-btn" data-act="add-rule">${esc(t("editor.add_rule"))}</button></div>` +
      `<div class="hint">${esc(t("editor.match_hint"))}</div>`;

    const rules = p.rules || [];
    if (!rules.length) html += `<div class="empty">${esc(t("editor.no_rules"))}</div>`;
    rules.forEach((r, i) => {
      const st = ruleView(p.id, r.id);
      const cls = st ? (st.status === "match" ? "r-match" : st.status === "no_match" ? "r-nomatch" : "r-inactive") : "";
      html += `<div class="card rule-box ${cls}">
        <div class="card-head">
          <span class="card-title">${esc(t("editor.rule_word"))} ${i + 1}</span>
          <span style="display:flex;align-items:center;gap:4px;">
            <input type="checkbox" data-bind="rules.${i}.enabled" data-cast="bool" ${r.enabled !== false ? "checked" : ""}>
            ${st ? badge(st.status) : ""}
            <button class="mini-btn" data-act="del-rule" data-i="${i}">&times;</button>
          </span>
        </div>
        <div class="hint">${esc(t("editor.conditions_title"))}</div>` +
        (r.conditions || []).map((c, j) => {
          const cv = st && (st.conditions || []).find(x => x.id === c.id);
          const b = `rules.${i}.conditions.${j}`;
          return `<div class="crow">
            <input type="checkbox" data-bind="${b}.enabled" data-cast="bool" ${c.enabled !== false ? "checked" : ""}>
            <span class="ct">${sel_(`${b}.type`, c.type || "wifi_ssid", COND_TYPES())}</span>
            <span class="cv">${condValue(b, c)}</span>
            ${cv ? badge(cv.status) : ""}
            <button class="mini-btn" data-act="del-cond" data-i="${i}" data-j="${j}">&times;</button>
          </div>`;
        }).join("") +
        `<button class="mini-btn" data-act="add-cond" data-i="${i}">${esc(t("editor.add_condition"))}</button></div>`;
    });

    // 检测方式排在条件之后：它决定的是「多久重看一次这些条件」，属于条件的注脚。
    html += `<div class="group-title">${esc(t("editor.detection_title"))}</div>` +
      row("editor.detection_mode", sel_("detection.mode", d.mode, [
        ["network_events", t("editor.detection_events")],
        ["network_events_and_polling", t("editor.detection_events_polling")],
        ["polling_only", t("editor.detection_polling")]])) +
      row("editor.change_delay", int("detection.change_delay_secs", d.change_delay_secs, "5")) +
      row("editor.poll_interval", int("detection.poll_interval_secs", d.poll_interval_secs, "30")) +
      ssidDatalist();
    box.innerHTML = html;
  }

  const ssidDatalist = () => `<datalist id="ssid-list">` +
    wifiList.filter(Boolean).map(s => `<option value="${esc(s)}"></option>`).join("") + `</datalist>`;

  /// SSID 可以手输（隐藏网络、还没连上过的环境都要能提前配好）。
  /// WKWebView 的 <datalist> 没有弹出 UI，所以用真正的 <select>，底部加 "Other…" 选项支持手输。
  function condValue(b, c) {
    const type = c.type || "wifi_ssid";
    if (type === "wifi_ssid") {
      const cur = String(c.value ?? "").trim();
      const ssids = wifiList.filter(Boolean);
      // 如果当前值不在列表里，保留它作为第一个选项
      const opts = (cur && !ssids.includes(cur)) ? [cur, ...ssids] : ssids;
      return `<select data-bind="${b}.value" style="max-width:220px" onchange="if(this.value==='__manual__'){this.outerHTML='<input type=text class=in data-bind='+this.dataset.bind+' value=\\''+esc(cur)+'\\' style=max-width:220px>'}">` +
        `<option value=""${cur ? "" : " selected"}>${esc(COND_PH.wifi_ssid)}</option>` +
        opts.map(s => `<option value="${esc(s)}" ${s === cur ? "selected" : ""}>${esc(s)}</option>`).join("") +
        `<option value="__manual__">${esc(t("editor.ssid_manual", "Manual entry…"))}</option>` +
        `</select>`;
    }
    if (type === "network_interface") {
      const cur = String(c.value || "").trim();
      // 构建 nicTitle -> name 的映射，用于显示和存储
      const ifaceMap = new Map();
      const titles = [];
      for (const n of nicList) {
        if (!n || !n.name || n.kind === "vpn") continue;
        const title = nicTitle(n);
        ifaceMap.set(title, n.name);
        titles.push(title);
      }
      // 当前值可能是设备名，需要找到对应的 title
      let curTitle = "";
      for (const [title, name] of ifaceMap) {
        if (name === cur) { curTitle = title; break; }
      }
      // 配置里写着这台机器现在没有的网卡是合法的（换台笔记本、拔了扩展坞）：
      // 那一项原样列出来，否则下拉会把已存的值改成另一张卡，一次保存就把人改了。
      if (cur && !curTitle) {
        titles.unshift(cur); // 未知设备直接放最前面
        ifaceMap.set(cur, cur);
      }
      return `<select data-bind="${b}.value">` +
        `<option value=""${cur ? "" : " selected"}>—</option>` +
        titles.map(title => {
          const name = ifaceMap.get(title) || title;
          return `<option value="${esc(name)}" ${name === cur ? "selected" : ""}>${esc(title)}</option>`;
        }).join("") +
        `</select>`;
    }
    return txt(`${b}.value`, c.value, COND_PH[type] || "");
  }

  /* —————————————————————— 第 3 列：3A 网络（先 THEN 后 ELSE） —————————————————————— */
  function renderNetColumn() {
    const box = $("col-net");
    if (!sel) { box.innerHTML = emptySel(); return; }
    box.innerHTML = BRANCHES().map(pre => netBlock(pre)).join("");
  }

  function netBlock(pre) {
    const b = scope(pre);
    let html = `<div class="branch-title ${pre === "else." ? "else" : ""}">${esc(t(branchTitle(pre)))}</div>`;
    const net = b.network;
    if (!net) return html + chk(pre_(pre, "network__new"), false, "editor.network_enable");
    const p = pre_(pre, "network");
    const manual = net.mode === "manual";
    const dnsState = net.dns === undefined ? "keep" : (String(net.dns).trim() === "" ? "auto" : "set");
    html += `<div class="group-title"><span>${esc(t("editor.network_title"))}</span>` +
      `<button class="mini-btn" data-act="drop-network" data-pre="${pre}">${esc(t("editor.action_delete"))}</button></div>`;
    // 顺序 = 配置栈从下到上：IPv4 → IPv6 → DNS → 静态路由。
    html += `<div class="group-title">${esc(t("editor.ipv4_config"))}</div>` +
      row("editor.config_type", sel_(p + ".mode", net.mode || "dhcp",
      [["dhcp", t("editor.dhcp")], ["manual", t("editor.manual")]]));
    if (manual) {
      html += row("editor.ip_address", txt(p + ".ip", net.ip, "192.168.1.100")) +
        row("editor.subnet_mask", txt(p + ".netmask", net.netmask, "255.255.255.0")) +
        row("editor.router", txt(p + ".gateway", net.gateway, "192.168.1.1"));
    }
    html += `<div class="group-title">${esc(t("editor.ipv6_config"))}</div>` +
      row("editor.config_type", sel_(p + ".v6mode", net.v6mode ?? "", [
        ["", t("editor.keep_unchanged")], ["automatic", t("editor.automatic")],
        ["manual", t("editor.manual_v6")], ["off", t("editor.off")]]));
    if (net.v6mode === "manual") {
      html += row("editor.ip_address", txt(p + ".ipv6", net.ipv6, "2001:db8::10")) +
        row("editor.prefix_length", txt(p + ".v6prefix", net.v6prefix, "64")) +
        row("editor.router", txt(p + ".v6gateway", net.v6gateway, "fe80::1"));
    }
    html += `<div class="group-title">${esc(t("editor.dns_config"))}</div>` +
      row("editor.config_type", `<select data-act="dns-tri" data-pre="${pre}">` +
        [["keep", t("editor.keep_unchanged")], ["auto", t("editor.system_auto")], ["set", t("editor.dns_servers")]]
          .map(([v, l]) => `<option value="${v}" ${dnsState === v ? "selected" : ""}>${esc(l)}</option>`).join("") +
        `</select>`) +
      /* 输入框在 auto/set 两态都画出来：数据上「指定但还没填」就是 `""`，
         与 auto 无法区分（配置里 `dns:""` 的含义就是「交回系统自动获取」），
         所以这里不造第三种状态，只是保证选了「指定」后看得见可编辑的框。 */
      (dnsState === "keep" ? `<div class="hint">${esc(t("editor.dns_placeholder"))}</div>`
        : row("editor.dns_servers", txt(p + ".dns", net.dns, "192.168.1.1,8.8.8.8"))) +
      renderRoutes(p, pre, net.routes || []);
    return html;
  }

  /// `pre` 是分支前缀（`"then."` / `""`），`np` 是这个分支 network 字段的完整路径。
  /// 增删路由要改的是分支对象，所以按钮上带的是前者；输入框绑定的是后者。
  function renderRoutes(np, pre, routes) {
    let html = `<div class="group-title"><span>${esc(t("editor.routes_title"))}</span>` +
      `<button class="mini-btn" data-act="add-route" data-pre="${pre}">${esc(t("editor.add_route"))}</button></div>`;
    if (!routes.length) return html + `<div class="empty">${esc(t("editor.action_none"))}</div>`;
    routes.forEach((r, i) => {
      const p = `${np}.routes.${i}`;
      html += `<div class="card"><div class="card-head">
          <span class="card-title">${esc(r.dest || t("editor.action_dest"))}</span>
          <button class="mini-btn" data-act="del-route" data-i="${i}" data-pre="${pre}">&times;</button></div>
        <div class="grid2">
          <div class="full">${txt(`${p}.dest`, r.dest, "10.0.0.0/8")}</div>
          <div>${txt(`${p}.gateway`, r.gateway, "192.168.1.1")}</div>
          <div>${int(`${p}.metric`, r.metric ?? 0, "0")}</div>
          <div class="full">${chk(`${p}.delete`, !!r.delete, "editor.route_delete", "inline")}</div>
        </div></div>`;
    });
    return html;
  }

  /// 校验（readback / 健康检查）不摊在主列里：它不是「要下发什么」，而是「下发完怎么算成功」，
  /// 属于列标题右边那个按钮背后的问题。
  function renderVerifyBlock(pre) {
    const net = scope(pre).network;
    if (!net) return `<div class="mv">${esc(t("editor.confirm_3a_none"))}</div>`;
    return renderVerify(pre_(pre, "network"), net.verify);
  }

  function renderVerify(pre, verify) {
    const v = verify || {};
    const h = v.health;
    let html = chk(`${pre}.verify.readback`, v.readback !== false, "editor.readback") +
      chk(`${pre}.verify__health`, !!h, "editor.health_enable");
    if (!h) return html;
    return html +
      row("editor.health_mode", sel_(`${pre}.verify.health.mode`, h.mode || "both",
        [["both", "ICMP + HTTP"], ["icmp", "ICMP"], ["http", "HTTP"]])) +
      row("editor.health_icmp", txt(`${pre}.verify.health.icmp_target`, h.icmp_target, "223.5.5.5")) +
      row("editor.health_http", txt(`${pre}.verify.health.http_target`, h.http_target, "http://cp.cloudflare.com")) +
      row("editor.health_interval", int(`${pre}.verify.health.interval`, h.interval ?? 30, "30")) +
      row("editor.health_retries", int(`${pre}.verify.health.retries`, h.retries ?? 3, "3")) +
      row("editor.health_timeout", int(`${pre}.verify.health.timeout`, h.timeout ?? 5, "5")) +
      chk(`${pre}.verify.health.fallback.enabled`, h.fallback?.enabled, "editor.health_fallback");
  }

  function renderVerifyModal() {
    if (!verifyOpen) { $("verify-mask").hidden = true; return; }
    $("verify-modal").innerHTML = `<h3>${esc(t("editor.verify_title"))}</h3>
      <div class="mv">${esc(t("editor.verify_modal_hint"))}</div>` +
      BRANCHES().map(pre => `<div class="branch-title ${pre === "else." ? "else" : ""}">${esc(t(branchTitle(pre)))}</div>` +
        renderVerifyBlock(pre)).join("") +
      `<div style="display:flex;justify-content:flex-end;margin-top:10px;">
        <button class="secondary" data-act="close-verify">${esc(t("editor.close"))}</button></div>`;
    $("verify-mask").hidden = false;
  }

  /* —————————————————————— 第 4 列：3B 动作（先 THEN 后 ELSE） —————————————————————— */
  function renderActColumn() {
    const box = $("col-act");
    if (!sel) { box.innerHTML = emptySel(); return; }
    if (sel.kind === "fallback") {
      box.innerHTML = `<div class="empty">${esc(t("editor.action_none"))}</div>`;
      return;
    }
    // 候选清单挂在列上而不是每个分支上：THEN 与 ELSE 两张列块若各带一份
    // `<datalist id="printer-list">`，那个 id 就重复了，浏览器只会认第一份。
    box.innerHTML = BRANCHES().map(pre => actBlock(pre)).join("") + printerDatalist();
  }

  /// 打印机名可以手输：这台机器上没装、但用户打算连上去的那台（共享打印机、以后才加的
  /// 那台）也要能提前配好，和 SSID 同一个道理。
  /// WKWebView 的 <datalist> 没有弹出 UI，所以用真正的 <select>，底部加 "Other…" 选项支持手输。
  const printerDatalist = () => {
    const printers = printerList.filter(p => p && p.name);
    return `<datalist id="printer-list">` +
      printers.map(p =>
        `<option value="${esc(p.name)}">${esc(p.info || (p.is_default ? t("editor.printer_is_default") : ""))}</option>`
      ).join("") + `</datalist>`;
  };

  function actBlock(pre) {
    const b = scope(pre);
    let html = `<div class="branch-title ${pre === "else." ? "else" : ""}">${esc(t(branchTitle(pre)))}</div>` +
      `<div class="group-title"><span>${esc(t("editor.one_shot_title"))}</span>` +
      `<span><button class="mini-btn" data-act="add-one" data-pre="${pre}" data-t="launch_app">${esc(t("editor.add_launch"))}</button> ` +
      `<button class="mini-btn" data-act="add-one" data-pre="${pre}" data-t="run_script">${esc(t("editor.add_run"))}</button> ` +
      `<button class="mini-btn" data-act="add-one" data-pre="${pre}" data-t="set_default_printer">${esc(t("editor.add_printer"))}</button></span></div>` +
      `<div class="hint">${esc(t("editor.actions_hint"))}</div>` +
      `<div class="hint" id="run-line-${pre.slice(0, -1)}" hidden></div>`;
    const list = b.one_shot || [];
    html += list.length ? list.map((a, i) => oneShotCard(`${pre}one_shot.${i}`, pre, a, i)).join("")
      : `<div class="empty">${esc(t("editor.action_none"))}</div>`;

    html += `<div class="group-title"><span>${esc(t("editor.persistent_title"))}</span>` +
      `<button class="mini-btn" data-act="add-persist" data-pre="${pre}">${esc(t("editor.add_persistent"))}</button></div>` +
      `<div class="hint">${esc(t(pre === "else." ? "editor.persistent_else" : "editor.persistent_hint"))}</div>`;
    const pl = b.persistent || [];
    html += pl.length ? pl.map((a, i) => persistCard(`${pre}persistent.${i}`, pre, a, i)).join("")
      : `<div class="empty">${esc(t("editor.action_none"))}</div>`;
    return html;
  }

  const ONE_TYPES = () => [["launch_app", t("editor.action_app")],
    ["run_script", t("editor.action_path")], ["set_default_printer", t("editor.action_printer")]];

  const actionWord = (a) => {
    const act = (a && a.action) || {};
    if (act.type === "run_script") return t("editor.action_path");
    if (act.type === "set_default_printer") return t("editor.action_printer");
    return t("editor.action_app");
  };
  const actionTarget = (a) => {
    const act = (a && a.action) || {};
    return act.path || act.app || act.printer || act.tunnel || act.profile || "—";
  };

  function oneShotCard(p, pre, a, i) {
    const act = a.action || {};
    const ty = act.type || "launch_app";
    let body = `<div>${sel_(`${p}.action.type`, ty, ONE_TYPES())}</div>` +
      row2("editor.priority", int(`${p}.priority`, a.priority ?? 100, "100"));
    if (ty === "run_script") {
      body += `<div class="full">${txt(`${p}.action.path`, act.path, "scripts/on-connect.sh")}</div>` +
        `<div class="full">${lst(`${p}.action.args`, act.args, "--flag")}</div>` +
        `<div class="full">${chk(`${p}.action.elevated`, !!act.elevated, "editor.action_elevated", "inline")}</div>`;
    } else if (ty === "set_default_printer") {
      // 打印机名可以手输：现在没装、连上那台网络后才有的共享打印机，也要能提前配好。
      // 打印机只能从系统已添加的列表中选择，不能有手动输入（未添加的打印机无法使用）
      const cur = String(act.printer ?? "").trim();
      const printers = printerList.filter(p => p && p.name);
      body += `<div class="full">` +
        `<select data-bind="${p}.action.printer" style="max-width:260px">` +
        `<option value=""${cur ? "" : " selected"}>${esc(t("editor.printer_placeholder", "Select printer…"))}</option>` +
        printers.map(pr => `<option value="${esc(pr.name)}" ${pr.name === cur ? "selected" : ""}>${esc(pr.info || pr.name)}</option>`).join("") +
        `</select>` +
        `</div>`;
    } else {
      body += `<div class="full">${txt(`${p}.action.app`, act.app, "/Applications/Slack.app")}</div>` +
        `<div class="full">${lst(`${p}.action.args`, act.args, "--flag")}</div>`;
    }
    return `<div class="card"><div class="card-head">
        <span class="card-title">${esc(actionWord(a))}</span>
        <span style="display:flex;gap:4px;align-items:center;">
          <span class="achip" id="achip-${p}"></span>
          <input type="checkbox" data-bind="${p}.enabled" data-cast="bool" ${a.enabled !== false ? "checked" : ""}>
          <button class="mini-btn" data-act="del-one" data-i="${i}" data-pre="${pre}">&times;</button></span></div>
        <div class="grid2">${body}</div>
        <div class="aerr" id="aerr-${p}" hidden></div></div>`;
  }

  const PERSIST_TYPES = () => [["periodic_script", t("editor.persist_script")],
    ["keep_wireguard_connected", t("editor.persist_wg")], ["keep_vpn_connected", t("editor.persist_vpn")]];

  // 卡片标题说「这是哪一类常驻动作」，词是本地化的；下拉框的 value 仍是配置里的
  // 机器词，那是要原样写回 JSON 的。
  const persistWord = (a) => ({
    keep_wireguard_connected: "editor.persist_wg",
    keep_vpn_connected: "editor.persist_vpn",
  }[(a.action || {}).type] || "editor.persist_script");

  function persistCard(p, pre, a, i) {
    const act = a.action || {};
    let body = `<div>${sel_(`${p}.action.type`, act.type || "periodic_script", PERSIST_TYPES())}</div>` +
      row2("editor.priority", int(`${p}.priority`, a.priority ?? 100, "100"));
    if (act.type === "keep_wireguard_connected") {
      body += `<div class="full">${txt(`${p}.action.tunnel`, act.tunnel, "wg0")}</div>`;
    } else if (act.type === "keep_vpn_connected") {
      body += `<div>${txt(`${p}.action.provider`, act.provider, t("editor.provider"))}</div>` +
        `<div>${txt(`${p}.action.profile`, act.profile, t("editor.vpn_profile"))}</div>`;
    } else {
      body += `<div class="full">${txt(`${p}.action.path`, act.path, "scripts/keepalive.sh")}</div>` +
        `<div class="full">${lst(`${p}.action.args`, act.args, "")}</div>`;
    }
    body += row2("editor.health_interval", int(`${p}.action.interval_secs`, act.interval_secs ?? 30, "30"));
    return `<div class="card"><div class="card-head">
        <span class="card-title">${esc(t(persistWord(a)))}</span>
        <span style="display:flex;gap:4px;align-items:center;">
          <span class="achip" id="wchip-${p}"></span>
          <input type="checkbox" data-bind="${p}.enabled" data-cast="bool" ${a.enabled !== false ? "checked" : ""}>
          <button class="mini-btn" data-act="del-persist" data-i="${i}" data-pre="${pre}">&times;</button></span></div>
        <div class="grid2">${body}</div>
        <div class="aerr" id="werr-${p}" hidden></div></div>`;
  }

  const emptySel = () => `<div class="empty">${esc(t("editor.none_selected"))}</div>`;

  /* —————————————————————— 渲染入口 —————————————————————— */
  // 静态标签只有一份来源：后端字典（静态标记里的英文是问不到字典时的兜底，由闸门
  // 要求与字典的 en 值逐字一致）。写在这里而不是逐个 id 手写赋值：新加一个标签只要
  // 在标记上挂 data-i18n，就不会出现「界面上多了一个英文标签」。
  function applyStatic() {
    const put = (n, key, set) => { const v = strings[key]; if (v) set(v); };
    for (const n of document.querySelectorAll("[data-i18n]"))
      put(n, n.dataset.i18n, (v) => { n.textContent = v; });
    for (const n of document.querySelectorAll("[data-i18n-placeholder]"))
      put(n, n.dataset.i18nPlaceholder, (v) => n.setAttribute("placeholder", v));
    for (const n of document.querySelectorAll("[data-i18n-title]"))
      put(n, n.dataset.i18nTitle, (v) => n.setAttribute("title", v));
    syncLang();
  }

  function renderAll() {
    applyStatic();
    renderStrip();
    renderProfiles();
    renderCondColumn();
    renderNetColumn();
    renderActColumn();
    renderVerifyModal();
    $("btn-apply").style.display = sel && sel.kind === "profile" ? "block" : "none";
    $("btn-delete").style.display = sel ? "block" : "none";
    refreshRun();
    refreshBanner();
  }

  /* —————————————————————— 冲突与零命中提示 —————————————————————— */
  function refreshBanner() {
    const bar = $("conflict-bar");
    const st = view && view.state;
    if (!st || st.state === "active") { bar.hidden = true; return; }
    bar.classList.toggle("info", st.state !== "conflict");
    bar.hidden = false;
    bar.textContent = st.state === "conflict"
      ? t("engine.conflict", { names: (st.ids || []).map(nameOf).join(", ") })
      : t("status.no_profile");
  }

  let lastConflictKey = "";
  function maybeShowConflictDialog() {
    const st = view && view.state;
    if (!st || st.state !== "conflict") { lastConflictKey = ""; return; }
    const names = (st.ids || []).map(nameOf);
    const key = names.join("|");
    if (key === lastConflictKey) return;
    lastConflictKey = key;
    $("conflict-modal").innerHTML = `<h3>${esc(t("editor.status_conflict"))}</h3>
      <div class="mv">${esc(t("engine.conflict", { names: names.join(", ") }))}</div>
      <ul>${names.map(n => `<li>${esc(n)}</li>`).join("")}</ul>
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button id="cf-ok">${esc(t("popup.close"))}</button></div>`;
    $("conflict-mask").hidden = false;
    $("cf-ok").onclick = () => { $("conflict-mask").hidden = true; };
  }

  /// 最近一次 3B1 运行是否就是「这一列的这一个分支」。
  /// 必须三者都对上才显示：别的 Profile 或另一分支的结果挂在这张表单上，
  /// 读起来就像刚刚跑过一遍，是纯粹的误导。
  function runOfBranch(pre) {
    const lr = view && view.last_run;
    if (!lr || !sel || sel.kind !== "profile") return null;
    return (lr.profile_id === sel.id && lr.branch === pre.slice(0, -1)) ? lr : null;
  }

  /// 动作级实时状态：一条跑完就换色，不用等整批收尾。
  /// 只改这几颗徽标和那一行小字，表单本身一律不动。
  function refreshRun() {
    if (!sel) return;
    for (const pre of BRANCHES()) {
      const lr = runOfBranch(pre);
      const line = $("run-line-" + pre.slice(0, -1));
      if (line) {
        line.hidden = !lr;
        if (lr) {
          const ok = (lr.outcomes || []).filter(o => o.ok).length;
          line.textContent = `${t("popup.last_run")} · ${lr.profile} · ${ok}/${lr.total}` +
            (lr.running ? ` · ${t("editor.action_running")}` : "");
        }
      }
      const b = scope(pre);
      (b.one_shot || []).forEach((a, i) => {
        const key = `${pre}one_shot.${i}`;
        const chip = $("achip-" + key);
        const err = $("aerr-" + key);
        if (chip) { chip.className = "achip"; chip.textContent = ""; chip.title = ""; }
        if (err) { err.hidden = true; err.textContent = ""; }
        if (!lr || a.enabled === false || !chip) return;
        const o = (lr.outcomes || []).find(x => x.id === a.id);
        if (o) {
          chip.textContent = o.ok ? t("editor.action_ok") : t("editor.action_failed");
          chip.className = "achip " + (o.ok ? "ok" : "bad");
          if (err && !o.ok && o.error) { err.textContent = o.error; err.hidden = false; }
        } else if (lr.running) {
          // 报告里还没有这条：它要么还在跑，要么排在后面的批次里
          chip.textContent = t("editor.action_running");
          chip.className = "achip run";
        }
      });
    }
    refreshWorkers();
  }

  /// worker 状态 → [文案 key, 徽标颜色]。
  /// `satisfied` 与 `repaired` 都是绿的，但字不一样：前者是「什么都没做」，
  /// 后者是「动手修过一次」—— 用户要知道的是维持有没有成本，不是两个同义词。
  const WORKER_STATE = {
    pending: ["editor.worker_pending", "run"],
    satisfied: ["editor.worker_satisfied", "ok"],
    repaired: ["editor.worker_repaired", "ok"],
    faulted: ["editor.worker_faulted", "bad"],
    overdue: ["editor.worker_overdue", "run"],
  };

  /// 此刻真的在被维持的 worker；不满足条件时返回 null。
  ///
  /// 别的分支与别的方案**不会**有 worker（常驻动作只随 Active 的 THEN 起，见后端
  /// `automation::persistent` 规则 1）。这里返回 null 让徽标全部留空：把上一个环境的
  /// 「已恢复」挂在用户正在填的表单上，比什么都不显示误导得多。
  function liveWorkers() {
    const ws = view && view.workers;
    if (!Array.isArray(ws) || !ws.length) return null;
    if (!sel || sel.kind !== "profile" || sel.id !== activeId()) return null;
    return ws;
  }

  /// 常驻 worker 的实时状态。与 3B1 一样只改徽标，重建表单会把用户正在填的东西冲掉。
  function refreshWorkers() {
    if (!sel || sel.kind !== "profile") return;
    const ws = liveWorkers();
    for (const pre of BRANCHES()) {
      const list = (scope(pre).persistent) || [];
      list.forEach((a, i) => {
        const key = `${pre}persistent.${i}`;
        const chip = $("wchip-" + key);
        const err = $("werr-" + key);
        if (chip) { chip.className = "achip"; chip.textContent = ""; chip.title = ""; }
        if (err) { err.hidden = true; err.textContent = ""; }
        // worker 只随 Active 的 THEN 起：ELSE 那一支的表单上永远不该有它的状态
        if (!ws || pre !== "then." || a.enabled === false || !chip) return;
        const w = ws.find(x => x.id === a.id);
        // 表单里有这条、worker 集合里却没有 = 它此刻根本没在被维持（草稿里刚加的、
        // 或改过 id 之后还没重新应用）。留空：「起好了但还没跑完第一次核对」后端会用
        // pending 自己说，前端不需要替它猜一个状态。
        if (!w) return;
        const [k, cls] = WORKER_STATE[w.state] || WORKER_STATE.pending;
        chip.textContent = t(k);
        chip.className = "achip" + (cls ? " " + cls : "");
        chip.title = `${w.label} · ${t("editor.worker_every", { secs: w.interval })}` +
          (w.repairs ? ` · ${w.repairs}×` : "");
        if (err && w.error) { err.textContent = w.error; err.hidden = false; }
      });
    }
  }

  /// 广播驱动的轻量刷新：只换状态条、徽标与提示条，不动用户正在填的表单。
  function refreshLive() {
    renderStrip();
    refreshBadges();
    refreshBanner();
    refreshRun();
    maybeShowConflictDialog();
  }

  /* —————————————————————— 选中与新建 —————————————————————— */
  function pick(kind, id) {
    dirty = false;
    sel = { kind, id };
    draft = kind === "profile" ? clone((cfg.profiles || []).find(p => p.id === id)) : null;
    if (kind === "profile" && !draft) sel = null;
    renderAll();
  }

  function newProfile(name, ssid) {
    const base = String(name || "").trim() || t("editor.untitled");
    let id = base.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    if (!id || cfg.profiles.some(p => p.id === id)) id = (id || "profile") + "-" + uid("").slice(-3);
    const p = {
      id, name: base, enabled: true, quick: true,
      detection: { mode: "network_events", change_delay_secs: 5, poll_interval_secs: 30 },
      rules: ssid ? [{ id: "r1", enabled: true, conditions: [{ id: "c1", enabled: true, type: "wifi_ssid", value: ssid }] }] : [],
      then: { network: { mode: "dhcp", verify: { readback: true } } },
    };
    cfg.profiles.push(p);
    dirty = true;
    sel = { kind: "profile", id };
    draft = clone(p);
    renderAll();
  }

  function addCondition(type, value) {
    if (!draft) { toast(t("editor.none_selected")); return; }
    (draft.rules ||= []);
    let r = draft.rules[draft.rules.length - 1];
    if (!r || r.enabled === false) { r = { id: uid("r"), enabled: true, conditions: [] }; draft.rules.push(r); }
    (r.conditions ||= []);
    const same = r.conditions.find(c => c.type === type);
    if (same) same.value = value;
    else r.conditions.push({ id: uid("c"), enabled: true, type, value });
    dirty = true;
    renderAll();
  }

  /* —————————————————————— 载入 —————————————————————— */
  /// 后端给 `Vec` 还是 JSON 字符串没有统一约定（见 frontend/README.md），所以两侧都认。
  const asArray = (v) => {
    if (typeof v === "string") { try { return JSON.parse(v); } catch (e) { return []; } }
    return v || [];
  };

  async function loadAll(keepSelection = true) {
    const prevSel = sel && { ...sel };
    try {
      const rawCfg = await invoke("get_config");
      cfg = typeof rawCfg === "string" ? JSON.parse(rawCfg) : rawCfg;
      cfg.profiles ||= [];
      globalDraft = { fallback: clone(cfg.fallback), allowed_scripts: (cfg.allowed_scripts || []).slice() };
      wifiList = (await invoke("get_networks").catch(() => [])) || [];
      nicList = asArray(await invoke("get_interfaces").catch(() => []));
      printerList = asArray(await invoke("get_printers").catch(() => []));
      const rawSt = await invoke("get_status");
      const st = typeof rawSt === "string" ? JSON.parse(rawSt) : rawSt;
      view = st.engine || null;
      langShown = st.language || langShown;
    } catch (e) {
      $("col-cond").innerHTML = `<div class="empty">invoke failed (run via cargo tauri dev): ${esc(String(e))}</div>`;
      return;
    }
    dirty = false;
    const stillThere = prevSel && prevSel.kind === "profile" && cfg.profiles.some(p => p.id === prevSel.id);
    if (keepSelection && stillThere) {
      sel = prevSel; draft = clone(cfg.profiles.find(p => p.id === prevSel.id));
    } else if (keepSelection && prevSel && prevSel.kind === "fallback") {
      sel = prevSel; draft = null;
      globalDraft.fallback ||= { enabled: true };
    } else if (cfg.profiles.length) {
      sel = { kind: "profile", id: cfg.profiles[0].id }; draft = clone(cfg.profiles[0]);
    } else {
      sel = { kind: "fallback" }; draft = null; globalDraft.fallback ||= { enabled: true };
    }
    renderAll();
  }

  /* —————————————————————— 输入事件 —————————————————————— */
  const isChoice = (el) => el.tagName === "SELECT" || (el.tagName === "INPUT" && el.type === "checkbox");

  function castValue(el) {
    if (el.dataset.cast === "bool") return el.checked;
    if (el.dataset.cast === "int") return num(el.value, 0);
    if (el.dataset.cast === "list") return el.value.trim() ? el.value.trim().split(/\s+/) : "";
    return el.value;
  }

  function onField(el) {
    const path = el.dataset.bind;
    const root = editRoot();
    if (!root) return;
    // 合成开关（不落在真实字段上）由 change 分支处理
    if (/__(new|health)$/.test(path)) return;
    const val = castValue(el);
    setPath(root, path, val === "" && el.tagName === "SELECT" ? undefined : val);
    // 会改变表单结构的字段必须重画；其余保持 DOM 不动，免得输入中途丢焦点
    if (/(^|\.)mode$|\.v6mode$|\.type$/.test(path)) renderAll();
  }

  document.addEventListener("input", (e) => {
    const el = e.target;
    if (!el.dataset || isChoice(el) || !el.dataset.bind) return;
    onField(el);
  });

  document.addEventListener("change", (e) => {
    const el = e.target;
    if (!el.dataset) return;
    if (el.dataset.act === "dns-tri") { setDnsMode(el.dataset.pre || "", el.value); return; }
    if (el.dataset.rowEn) { patchFlag(el.dataset.rowEn, "enabled", el.checked); return; }
    if (el.dataset.rowQuick) { patchFlag(el.dataset.rowQuick, "quick", el.checked); return; }
    if (el.dataset.rowFbEn) { patchFallbackFlag(el.checked); return; }
    if (el.dataset.bind && isChoice(el)) {
      const path = el.dataset.bind;
      // 合成开关的绑定路径形如 `then.network__new` / `then.network.verify__health`，
      // 它们要定位的是**分支**，所以取 `network` 之前的那一段前缀。
      const owner = path.slice(0, path.lastIndexOf("network"));
      if (/__new$/.test(path)) { toggleNetwork(el.checked, owner); return; }
      if (/__health$/.test(path)) { toggleHealth(el.checked, owner); return; }
      onField(el);
      // 名字与勾选框在第 1 列那一行上：改了要让那一行的状态跟着变（生效描边、脏点）。
      // 只重建第 1 列与状态条 —— 重建第 2~4 列会把用户正在输入的东西冲掉。
      if (path === "enabled" || path === "quick") { renderProfiles(); renderStrip(); }
    }
  });

  /// DNS 是三态的（不改 / 清空 / 指定），而 `""` 与字段缺失在 3A 里含义不同，
  /// 所以用一个下拉决定要写什么，而不是靠输入框是不是空。
  function setDnsMode(pre, mode) {
    const net = scope(pre).network;
    if (!net) return;
    if (mode === "keep") delete net.dns;
    else if (mode === "auto") net.dns = "";
    else net.dns = typeof net.dns === "string" ? net.dns : "";
    dirty = true;
    renderNetColumn();
  }

  function toggleNetwork(on, pre) {
    const b = scope(pre);
    if (on) b.network = { mode: "dhcp", verify: { readback: true } };
    else delete b.network;
    dirty = true;
    renderAll();
  }
  function toggleHealth(on, pre) {
    const net = scope(pre).network;
    if (!net) return;
    net.verify ||= {};
    if (on) net.verify.health = { enabled: true, mode: "both", interval: 30, retries: 3, timeout: 5, fallback: { enabled: false } };
    else delete net.verify.health;
    dirty = true;
    renderVerifyModal();
  }

  /// 列表里那些**没被选中**的行的勾选框：没有草稿可改，就直接改磁盘上那一份。
  /// 「编辑器里勾着但没保存」和「系统实际的开关状态」必须是同一件事，否则用户
  /// 按勾选框判断哪些方案在生效，判断的是空气。
  async function patchFlag(id, field, value) {
    const saved = savedProfile(id);
    if (!saved) return;
    const payload = cleanProfile({ ...clone(saved), [field]: value });
    try {
      await invoke("save_profile", { payload: JSON.stringify(payload) });
      await loadAll();
    } catch (err) {
      toast(t("editor.save_failed", { error: String(err) }));
      await loadAll();
    }
  }

  async function patchFallbackFlag(value) {
    await saveGlobal({ ...(globalDraft.fallback || {}), enabled: value });
  }

  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-act]");
    if (!el) return;
    // 行里嵌着控件：点在控件上是控件的事，不能顺带把这一行选成当前编辑对象
    const hit = e.target.closest("input,select,textarea,button,label");
    if (hit && hit !== el) return;
    const act = el.dataset.act;
    const pre = el.dataset.pre || "";
    switch (act) {
      case "sel-profile": pick("profile", el.dataset.id); return;
      case "sel-fallback": globalDraft.fallback ||= { enabled: true }; pick("fallback"); return;
      case "open-verify": verifyOpen = true; renderVerifyModal(); return;
      case "close-verify": verifyOpen = false; renderVerifyModal(); return;
      case "use-cond": addCondition(el.dataset.type, el.dataset.val); return;
      case "add-rule": (draft.rules ||= []).push({ id: uid("r"), enabled: true, conditions: [] }); renderAll(); return;
      case "del-rule": draft.rules.splice(Number(el.dataset.i), 1); renderAll(); return;
      case "add-cond": {
        const r = draft.rules[Number(el.dataset.i)];
        (r.conditions ||= []).push({ id: uid("c"), enabled: true, type: "wifi_ssid", value: "" });
        renderAll(); return;
      }
      case "del-cond": draft.rules[Number(el.dataset.i)].conditions.splice(Number(el.dataset.j), 1); renderAll(); return;
      case "drop-network": delete scope(pre).network; renderAll(); return;
      case "add-route": {
        const net = scope(pre).network;
        if (!net) return;
        (net.routes ||= []).push({ dest: "", gateway: "", metric: 0, delete: false });
        renderNetColumn(); return;
      }
      case "del-route": {
        const net = scope(pre).network;
        if (!net) return;
        net.routes.splice(Number(el.dataset.i), 1);
        renderNetColumn(); return;
      }
      case "add-one": {
        const b = scope(pre);
        const ty = el.dataset.t || "launch_app";
        // 每种动作只带自己那几个字段：set_default_printer 没有 args，也不该长出一个空的。
        const action = ty === "run_script" ? { type: ty, path: "", args: [] }
          : ty === "set_default_printer" ? { type: ty, printer: "" }
            : { type: "launch_app", app: "", args: [] };
        (b.one_shot ||= []).push({ id: uid("a"), enabled: true, priority: 100, action });
        renderActColumn(); refreshRun(); return;
      }
      case "del-one":
        scope(pre).one_shot.splice(Number(el.dataset.i), 1);
        renderActColumn(); refreshRun(); return;
      case "add-persist": {
        const b = scope(pre);
        (b.persistent ||= []).push({ id: uid("p"), enabled: true, priority: 100,
          action: { type: "periodic_script", path: "", args: [], interval_secs: 30 } });
        renderActColumn(); refreshRun(); return;
      }
      case "del-persist":
        scope(pre).persistent.splice(Number(el.dataset.i), 1);
        renderActColumn(); refreshRun(); return;
      default: return;
    }
  });

  $("btn-new").onclick = () => newProfile(`${t("editor.untitled")} ${cfg.profiles.length + 1}`);

  /* —————————————————————— 保存 / 应用 / 删除 ——————————————————————
     `clean*` 一组函数负责把界面上的「中间态」压回 serde 认识的样子：
     留空的可选字段整个删掉（而不是写成 ""），因为 `""` 与「未配置」在
     3A 里含义不同 —— `dns: ""` 是「明确清空 DNS」，`dns` 缺失才是「别碰 DNS」。 */
  function cleanNetwork(n) {
    const out = { mode: n.mode === "manual" ? "manual" : "dhcp" };
    if (out.mode === "manual") {
      out.ip = (n.ip || "").trim();
      out.netmask = (n.netmask || "").trim();
      out.gateway = (n.gateway || "").trim();
    }
    if (n.dns !== undefined && n.dns !== null) out.dns = String(n.dns).trim();
    if (n.v6mode) {
      out.v6mode = n.v6mode;
      if (n.v6mode === "manual") {
        out.ipv6 = (n.ipv6 || "").trim();
        if ((n.v6prefix || "").trim()) out.v6prefix = String(n.v6prefix).trim();
        if ((n.v6gateway || "").trim()) out.v6gateway = String(n.v6gateway).trim();
      }
    }
    const routes = (n.routes || []).filter(r => (r.dest || "").trim()).map(r => {
      const o = { dest: r.dest.trim(), metric: num(r.metric, 0) };
      if ((r.gateway || "").trim()) o.gateway = r.gateway.trim();
      if (r.delete) o.delete = true;
      return o;
    });
    if (routes.length) out.routes = routes;
    const v = n.verify;
    if (v && (v.readback === false || v.health)) {
      const vo = { readback: v.readback !== false };
      if (v.health) {
        const h = v.health;
        vo.health = {
          enabled: true, mode: h.mode || "both",
          interval: num(h.interval, 30), retries: num(h.retries, 3), timeout: num(h.timeout, 5),
          fallback: { enabled: !!(h.fallback && h.fallback.enabled) },
        };
        if ((h.icmp_target || "").trim()) vo.health.icmp_target = h.icmp_target.trim();
        if ((h.http_target || "").trim()) vo.health.http_target = h.http_target.trim();
      }
      out.verify = vo;
    }
    return out;
  }

  function cleanActionList(list, kind) {
    const out = [];
    for (const a of list || []) {
      if (!a.id) a.id = uid(kind === "one" ? "a" : "p");
      const act = a.action || {};
      const item = { id: a.id, enabled: a.enabled !== false, priority: num(a.priority, 100), action: null };
      if (kind === "one") {
        item.action = act.type === "run_script"
          ? { type: "run_script", path: (act.path || "").trim() }
          : act.type === "set_default_printer"
            ? { type: "set_default_printer", printer: (act.printer || "").trim() }
            : { type: "launch_app", app: (act.app || "").trim() };
      } else if (act.type === "keep_wireguard_connected") {
        item.action = { type: "keep_wireguard_connected", tunnel: (act.tunnel || "").trim() };
      } else if (act.type === "keep_vpn_connected") {
        item.action = { type: "keep_vpn_connected", provider: (act.provider || "").trim(), profile: (act.profile || "").trim() };
      } else {
        item.action = { type: "periodic_script", path: (act.path || "").trim() };
      }
      if (item.action.type === "keep_vpn_connected" || item.action.type === "keep_wireguard_connected" || item.action.type === "periodic_script")
        item.action.interval_secs = num(act.interval_secs, 30);
      // 只有「跑一个程序 / 跑一个脚本」才有参数可带。按白名单挂，新增动作类型时
      // 不会顺手把一个它根本不认的 args 字段写进配置。
      if ((act.args || []).length && ["run_script", "launch_app", "periodic_script"].includes(item.action.type))
        item.action.args = act.args;
      if (act.elevated && item.action.type === "run_script") item.action.elevated = true;
      out.push(item);
    }
    return out;
  }

  function cleanBranch(b) {
    if (!b) return null;
    const out = {};
    if (b.network) out.network = cleanNetwork(b.network);
    const one = cleanActionList(b.one_shot, "one");
    if (one.length) out.one_shot = one;
    const per = cleanActionList(b.persistent, "persist");
    if (per.length) out.persistent = per;
    return (out.network || out.one_shot || out.persistent) ? out : null;
  }

  function cleanProfile(p) {
    const d = p.detection || {};
    const out = {
      id: (p.id || "").trim(),
      name: (p.name || "").trim(),
      enabled: p.enabled !== false,
      // 「快速切换」勾选必须一起写回：不写就等于每次保存都把老配置里的默认值覆盖掉，
      // 用户在面板上收起的方案会因为一次无关的编辑重新冒出来。
      quick: p.quick !== false,
      detection: {
        mode: d.mode || "network_events",
        change_delay_secs: num(d.change_delay_secs, 5),
        poll_interval_secs: num(d.poll_interval_secs, 30),
      },
      rules: (p.rules || []).map((r, i) => ({
        id: r.id || "r" + (i + 1),
        enabled: r.enabled !== false,
        conditions: (r.conditions || []).map((c, j) => ({
          id: c.id || "r" + (i + 1) + "c" + (j + 1),
          enabled: c.enabled !== false,
          type: c.type || "wifi_ssid",
          value: String(c.value == null ? "" : c.value).trim(),
        })),
      })),
    };
    const th = cleanBranch(p.then); if (th) out.then = th;
    const el = cleanBranch(p.else || p.else_branch); if (el) out.else = el;
    return out;
  }

  /// `save_global` 是**整份替换**：兜底与脚本白名单一起写，缺一个就等于把它清空了。
  /// 白名单的编辑界面已经搬到软件设置里，这里必须原样带过去，不能顺手丢掉。
  async function saveGlobal(fallback) {
    const payload = {
      fallback: fallback ? { enabled: fallback.enabled !== false, ...(fallback.network ? { network: cleanNetwork(fallback.network) } : {}) } : null,
      allowed_scripts: globalDraft.allowed_scripts,
    };
    try {
      await invoke("save_global", { payload: JSON.stringify(payload) });
      toast(t("editor.saved", { name: t("editor.global_fallback") }));
      dirty = false;
      await loadAll();
    } catch (err) { toast(t("editor.save_failed", { error: String(err) })); }
  }

  $("btn-save").onclick = async () => {
    if (!sel) { toast(t("editor.none_selected")); return; }
    if (sel.kind === "profile") {
      const payload = cleanProfile(draft);
      if (!payload.name) { toast(t("editor.name") + " ?"); return; }
      if (!payload.rules.length) { toast(t("editor.match_required")); return; }
      try {
        await invoke("save_profile", { payload: JSON.stringify(payload) });
        toast(t("editor.saved", { name: payload.name }));
        dirty = false;
        await loadAll();
      } catch (err) { toast(t("editor.save_failed", { error: String(err) })); }
      return;
    }
    await saveGlobal(globalDraft.fallback);
  };

  /* —————————————— 「立即应用」前的执行确认清单 —————————————— */
  const branchWord = (w) => t(w === "then" ? "editor.then" : "editor.else_branch");

  /// 一条动作在清单上怎么说：类型 + 目标 + 参数 + 是否需要提权。
  /// 上一次的结果（若有）直接挂在行尾 —— 用户点「再来一次」时最想知道的就是上次哪儿没成。
  function actionLine(a, lr) {
    const act = a.action || {};
    const args = (act.args || []).length ? " " + act.args.join(" ") : "";
    const o = lr && (lr.outcomes || []).find(x => x.id === a.id);
    const tag = o
      ? `<span class="achip ${o.ok ? "ok" : "bad"}">${esc(o.ok ? t("editor.action_ok") : t("editor.action_failed"))}</span>`
      : (lr && lr.running
        ? `<span class="achip run">${esc(t("editor.action_running"))}</span>` : "");
    return `<li>${esc(actionWord(a))}: ${esc(actionTarget(a))}${esc(args)}` +
      (act.type === "run_script" && act.elevated ? ` <span class="badge">${esc(t("editor.action_elevated"))}</span>` : "") +
      ` ${tag}</li>`;
  }

  /// 按 priority 分批：同数字的是同一批（并发），数字小的先跑完才轮到下一批。
  function planList(list, lr) {
    const run = list.filter(a => a.enabled !== false)
      .slice().sort((x, y) => (x.priority ?? 100) - (y.priority ?? 100));
    if (!run.length) return `<div class="mv">${esc(t("editor.action_none"))}</div>`;
    const groups = [];
    for (const a of run) {
      const p = a.priority ?? 100;
      const last = groups[groups.length - 1];
      if (last && last.p === p) last.list.push(a);
      else groups.push({ p, list: [a] });
    }
    return groups.map(g =>
      `<div class="mv"><b>${esc(t("editor.priority"))} ${g.p}</b></div>` +
      `<ul>${g.list.map(a => actionLine(a, lr)).join("")}</ul>`).join("");
  }

  /// 常驻动作在「立即应用」前的样子：走 THEN 会真的起 worker 并一直维持，
  /// 走 ELSE 一条都不会起。这份清单必须与后端的判定同构，否则给用户看的是假承诺。
  function planPersistent(plan) {
    const list = (plan.branch.persistent || []).filter(a => a.enabled !== false)
      .slice().sort((x, y) => (x.priority ?? 100) - (y.priority ?? 100));
    if (!list.length) return `<div class="mv">${esc(t("editor.action_none"))}</div>`;
    if (plan.which !== "then") return `<div class="mv">${esc(t("editor.persistent_else"))}</div>`;
    return `<ul>` + list.map(a => {
      const act = a.action || {};
      const secs = act.interval_secs ?? 30;
      const what = act.tunnel || act.profile || act.path || "";
      return `<li>${esc(t(persistWord(a)))}${what ? " · " + esc(what) : ""} · ${esc(t("editor.worker_every", { secs }))}</li>`;
    }).join("") + `</ul>`;
  }

  /// 引擎对「立即应用」的处置：重新评估这个 Profile 自己 —— 命中走 THEN，否则走 ELSE。
  /// 清单必须按同一套规则挑分支与被拒情形，否则给用户看的那一份就是假的。
  /// 分支与被拒的判断取自**已保存**的配置：引擎跑的是磁盘上那份，不是编辑器里没保存的草稿。
  function applyPlan(saved) {
    if (saved.enabled === false) {
      return { refuse: t("engine.disabled", { name: saved.name || saved.id }) };
    }
    const pv = profileView(saved.id) || {};
    const st = view && view.state;
    if (pv.status === "conflict" || (st && st.state === "conflict" && (st.ids || []).includes(saved.id))) {
      const others = ((st && st.ids) || []).filter(i => i !== saved.id).map(nameOf).join(", ");
      return {
        refuse: t("engine.conflict_blocked", { name: saved.name || saved.id, others }),
      };
    }
    const which = pv.matched ? "then" : "else";
    const b = saved[which];
    if (!b) {
      return {
        refuse: t("engine.no_branch", {
          name: saved.name || saved.id, branch: branchWord(which),
        }),
      };
    }
    return { which, branch: b };
  }

  async function runApply() {
    if (!sel || sel.kind !== "profile") return;
    try {
      await invoke("apply_profile", { id: sel.id });
      // apply_profile 只是把请求排进引擎队列：成功/被拒绝都由 `netsense://action` 回报
      toast(t("notify.apply_requested", { name: draft ? draft.name : sel.id }));
    } catch (err) { toast(String(err)); }
  }

  function renderApplyConfirm() {
    const name = (draft && (draft.name || draft.id)) || sel.id;
    const saved = savedProfile(sel.id);
    const modal = $("apply-modal");
    const btns = (ids) => `<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px;">` +
      ids.map(([id, label, cls]) =>
        `<button class="${cls || ""}" id="${id}">${esc(label)}</button>`).join("") + `</div>`;
    if (!saved) {
      modal.innerHTML = `<h3>${esc(t("editor.confirm_title", { name }))}</h3>` +
        `<div class="mv">${esc(t("engine.unknown_profile", { name }))}</div>` +
        btns([["ap-close", t("popup.close")]]);
      $("apply-mask").hidden = false;
      $("ap-close").onclick = () => { $("apply-mask").hidden = true; };
      return;
    }
    const plan = applyPlan(saved);
    if (plan.refuse) {
      modal.innerHTML = `<h3>${esc(t("editor.confirm_title", { name }))}</h3>` +
        `<div class="mv">${esc(plan.refuse)}</div>` +
        btns([["ap-close", t("popup.close")]]);
      $("apply-mask").hidden = false;
      $("ap-close").onclick = () => { $("apply-mask").hidden = true; };
      return;
    }
    const lr = view && view.last_run;
    const shown = lr && lr.profile_id === saved.id && lr.branch === plan.which ? lr : null;
    const net = plan.branch.network;
    modal.innerHTML = `<h3>${esc(t("editor.confirm_title", { name: saved.name || saved.id }))}</h3>` +
      `<div class="mv">${esc(t("editor.confirm_branch", { branch: branchWord(plan.which) }))}</div>` +
      (dirty ? `<div class="mv">${esc(t("editor.confirm_dirty"))}</div>` : "") +
      `<div class="mv"><b>${esc(t("editor.network_title"))}</b> · ` +
      `${esc(net ? t(net.mode === "manual" ? "editor.manual" : "editor.dhcp") : t("editor.confirm_3a_none"))}</div>` +
      `<div class="mv"><b>${esc(t("editor.one_shot_title"))}</b></div>` +
      planList(plan.branch.one_shot || [], shown) +
      `<div class="mv"><b>${esc(t("editor.persistent_title"))}</b></div>` +
      planPersistent(plan) +
      `<div class="mv">${esc(t("editor.confirm_timeout"))}</div>` +
      btns([["ap-cancel", t("editor.confirm_cancel")], ["ap-run", t("editor.force_apply"), "warning"]]);
    $("apply-mask").hidden = false;
    $("ap-cancel").onclick = () => { $("apply-mask").hidden = true; };
    $("ap-run").onclick = () => { $("apply-mask").hidden = true; runApply(); };
  }

  $("btn-apply").onclick = () => {
    if (!sel || sel.kind !== "profile") return;
    renderApplyConfirm();
  };

  /// 删除确认必须走应用自己的遮罩：主窗口里没有原生对话框的宿主，
  /// `confirm()` 会永远返回 false，点「删除」就成了没有反应的死按钮。
  function askDelete(msg) {
    return new Promise((resolve) => {
      const close = (r) => { $("del-mask").hidden = true; resolve(r); };
      $("del-modal").innerHTML = `<h3>${esc(t("editor.delete"))}</h3>` +
        `<div class="mv">${esc(msg)}</div>` +
        `<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px;">` +
        `<button id="del-no">${esc(t("editor.confirm_cancel"))}</button>` +
        `<button class="danger" id="del-yes">${esc(t("editor.delete"))}</button>` +
        `</div>`;
      $("del-mask").hidden = false;
      $("del-no").onclick = () => close(false);
      $("del-yes").onclick = () => close(true);
    });
  }

  $("btn-delete").onclick = async () => {
    if (!sel) return;
    if (sel.kind === "profile") {
      const name = draft ? draft.name : sel.id;
      if (!(await askDelete(t("editor.confirm_delete", { name })))) return;
      try {
        await invoke("delete_profile", { id: sel.id });
        toast(t("editor.deleted", { name }));
        sel = null; draft = null;
        await loadAll(false);
      } catch (err) { toast(String(err)); }
    } else if (globalDraft.fallback) {
      delete globalDraft.fallback.network;
      renderAll();
    }
  };

  $("btn-close").onclick = () => { invoke("close_editor").catch(() => {}); };

  /* —————————————————————— 广播 —————————————————————— */
  /// 编辑器跟随全局语言：语言是在软件设置里改的，改完这个窗口必须在下一次重绘时
  /// 就说同一种语言，而不是等用户重开窗口。
  async function syncLanguage(code) {
    if (!code || code === langShown) return;
    langShown = code;
    try { strings = await invoke("get_strings"); } catch (e) { return; }
    renderAll();
  }

  if (window.__TAURI__ && window.__TAURI__.event) {
    const L = window.__TAURI__.event.listen;
    L("netsense://status", (e) => {
      const p = typeof e.payload === "string" ? JSON.parse(e.payload) : e.payload;
      if (p && p.engine) { view = p.engine; refreshLive(); }
      if (p) syncLanguage(p.language);
    });
    L("netsense://evaluation", (e) => {
      const p = typeof e.payload === "string" ? JSON.parse(e.payload) : e.payload;
      if (p) { view = p; refreshLive(); }
    });
    L("netsense://conflict", () => maybeShowConflictDialog());
    // 后台动作的结果只做提示：配置内容没变，重读会把用户正在填的表单冲掉
    L("netsense://action", (e) => {
      const p = e.payload || {};
      if (p.message) toast(p.message);
    });
  }

  (async () => {
