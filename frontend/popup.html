<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>NetSense</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    /* 本窗口内的别名：markup 认左边的名字，颜色的真相在 theme.css 的 `--t-*`，
       深浅两套共用同一批别名（`color-scheme` 也在那一份里按档声明）。 */
    :root {
      --bg: var(--t-bg);
      --bg-card: var(--t-card);
      --line: var(--t-line);
      --fg: var(--t-fg);
      --muted: var(--t-fg-dim);
      --accent: var(--t-accent);
      --ok: var(--t-ok);
      --warn: var(--t-warn);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg); color: var(--fg);
      font: 12px/1.45 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      user-select: none;
      /* 整块面板是唯一的滚动容器：以前每段各自开 overflow-y，网卡多了时外面不动、
         里面滚，鼠标滚轮落在哪一段就只滚那一段（用户报的「内部模块可滚动」）。 */
      overflow-y: auto;
      display: flex; flex-direction: column;
    }
    /* 滚动容器里的 flex 子项默认允许压缩：不关掉的话内容一多，各段被挤扁，
       永远滚不到底。 footer 的 margin-top:auto 与这条不冲突（没有剩余空间时自动边距为 0）。 */
    body > * { flex: none; }
    header {
      position: sticky; top: 0; z-index: 5; background: var(--bg);
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px 8px; border-bottom: 1px solid var(--line);
    }
    header b { font-size: 13px; letter-spacing: .2px; }
    header .ver { font-size: 11px; color: var(--muted); margin-left: 5px; }
    .head-right { display: flex; align-items: center; gap: 6px; }
    button.tiny {
      flex: none; padding: 2px 7px; font-size: 10px; border-radius: var(--t-r-sm);
      border: 1px solid var(--line); background: var(--bg-card); color: var(--muted);
    }
    .card {
      background: var(--bg-card); border: 1px solid var(--line);
      border-radius: var(--t-r-md); margin: 10px 12px 0; padding: 9px 10px;
    }
    .row { display: flex; justify-content: space-between; gap: 10px; }
    .row + .row { margin-top: 4px; }
    /* .row 自带 display，会把 [hidden] 的 UA 样式盖掉，这里补回来 */
    .row[hidden] { display: none; }
    .k { color: var(--muted); }
    .v { text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 62%; }
    .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
    .dot.on { background: var(--ok); }
    /* Profile 状态徽标：ACTIVE / CONFLICT / ERROR 三种必须一眼分得开
       （CONFLICT 是条件层，ERROR 是执行层，混在一起就没法排障） */
    .sw .st { font-size: 10px; padding: 1px 6px; border-radius: var(--t-r-pill); background: var(--t-tint-neutral); color: var(--t-tint-neutral-fg); }
    .sw .st.active { background: var(--t-tint-ok); color: var(--t-tint-ok-fg); }
    .sw .st.conflict { background: var(--t-tint-warn); color: var(--t-tint-warn-fg); }
    .sw .st.error { background: var(--t-tint-bad); color: var(--t-tint-bad-fg); }
    .sw .st.off { background: var(--t-tint-off); color: var(--t-tint-off-fg); }
    /* 引擎还没给出这一条的状态时，别画一枚空药丸：那一块底看起来像一个坏掉的指示灯。
       （编辑器那边 `.achip:empty` 早就是这条规矩。） */
    .sw .st:empty { display: none; }
    .sw.disabled { color: var(--muted); }
    .v.warn { color: var(--warn); }
    .v.bad { color: var(--t-err); }
    .cards { margin: 8px 12px 0; }
    .nic-card {
      background: var(--bg-card); border: 1px solid var(--line);
      border-radius: var(--t-r-md); padding: 7px 9px; margin-bottom: 6px;
    }
    .nic-head { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-bottom: 3px; }
    .nic-name { font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nic-tag { font-size: 9px; padding: 1px 5px; border-radius: var(--t-r-pill); background: var(--t-tint-info); color: var(--t-tint-info-fg); white-space: nowrap; }
    .nic-tag.vpn { background: var(--t-tint-vpn); color: var(--t-tint-vpn-fg); }
    .nic-end { display: flex; align-items: center; gap: 5px; min-width: 0; }
    .nic-state { font-size: 10px; color: var(--muted); white-space: nowrap; }
    .nic-state.on { color: var(--t-ok); }
    .nic-row { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; }
    .nic-row .k { color: var(--muted); }
    .nic-row .v { text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 66%; }
    .section { padding: 10px 12px 0; color: var(--muted); font-size: 10px;
               text-transform: uppercase; letter-spacing: .8px; }
    .switches { margin: 6px 12px 0; border: 1px solid var(--line); border-radius: var(--t-r-md); overflow: hidden; }
    .sw {
      display: flex; justify-content: space-between; align-items: center;
      padding: 7px 10px; cursor: pointer; font-size: 12px;
    }
    .sw + .sw { border-top: 1px solid var(--line); }
    .sw:hover { background: var(--t-hover); }
    .sw.current { color: var(--ok); }
    .sw .go { color: var(--muted); font-size: 11px; }
    .sw:hover .go { color: var(--accent); }
    .empty { padding: 10px; color: var(--muted); text-align: center; }
    footer {
      margin-top: auto; padding: 10px 12px; border-top: 1px solid var(--line);
      display: flex; flex-wrap: wrap; gap: 8px;
    }
    button {
      flex: 1; padding: 7px 0; font-size: 12px; border-radius: var(--t-r-sm); cursor: pointer;
      border: 1px solid var(--line); background: var(--bg-card); color: var(--fg);
    }
    /* 六个入口塞在一行里，每个只剩 50px 宽，「Check for Updates」会被挤到换行或截断；
       这里按三列排，宽度不够就自己换行。 */
    footer button { flex: 1 1 28%; min-width: 88px; }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--t-on-accent); }
    button:active { transform: translateY(1px); }
    /* 托盘面板只有按钮，但键盘 Tab 也得看得出焦点在哪一条上。 */
    :focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    /* 面板只有 360px 宽：报错信息往往比这还长，不限宽的话 `nowrap` 会把两头都切到窗口外面。
       z-index 要高于确认弹层（`.modal-mask` 是 50），否则「应用失败」那条回执被压在罩子底下。 */
    .toast {
      position: fixed; left: 50%; bottom: 54px; transform: translateX(-50%); z-index: 60;
      background: var(--t-toast-bg); border: 1px solid var(--line); color: var(--t-on-accent);
      padding: 5px 12px; border-radius: var(--t-r-pill); font-size: 11px; opacity: 0;
      transition: opacity .18s; pointer-events: none; white-space: nowrap;
      max-width: 92%; overflow: hidden; text-overflow: ellipsis;
    }
    .toast.show { opacity: 1; }
    ::-webkit-scrollbar { width: 5px; }
    .modal-mask { position: fixed; inset: 0; background: var(--t-mask);
      display: flex; align-items: center; justify-content: center; z-index: 50; }
    .modal-mask[hidden] { display: none; }
    .modal { width: 304px; max-width: 92%; background: var(--bg-card);
      border: 1px solid var(--line); border-radius: var(--t-r-md); padding: 14px;
      box-shadow: var(--t-shadow); }
    .modal h3 { margin: 0 0 8px; font-size: 13px; }
    .modal .mv { font-size: 12px; color: var(--muted); margin: 3px 0; }
    .modal .mv b { color: var(--fg); }
    .modal pre { background: var(--t-sunken); border: 1px solid var(--line); border-radius: var(--t-r-sm);
      padding: 6px 8px; font-size: 11px; overflow-x: auto; margin: 6px 0;
      white-space: pre-wrap; word-break: break-all; }
    .modal .row-btns { display: flex; gap: 8px; margin-top: 10px; }
    .modal .row-btns button { flex: 1; padding: 7px 0; font-size: 12px; border-radius: var(--t-r-sm);
      cursor: pointer; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
    .modal .row-btns button:first-child { background: var(--accent); border-color: var(--accent); color: var(--t-on-accent); }
    .modal .notes { max-height: 130px; overflow-y: auto; font-size: 11px; color: var(--muted);
      white-space: pre-wrap; margin-top: 8px; border-top: 1px solid var(--line); padding-top: 8px; }
    .modal .err { color: var(--t-err); font-size: 11px; word-break: break-word; margin: 6px 0; }
    .progress { height: 6px; background: var(--t-sunken); border: 1px solid var(--line);
      border-radius: var(--t-r-pill); overflow: hidden; margin: 8px 0 4px; }
    .progress .bar { height: 100%; width: 0%; background: var(--accent); border-radius: var(--t-r-pill);
      transition: width .2s ease; }
    .progress .bar.indeterminate { width: 35% !important; animation: indet 1s ease-in-out infinite; }
    @keyframes indet { 0% { margin-left: 0; } 100% { margin-left: 65%; } }
  </style>
</head>
<body>
  <header>
    <span><b>NetSense</b><span class="ver" id="ver"></span></span>
    <span class="head-right">
      <button class="tiny" id="btn-quit" data-i18n="tray.quit">Quit NetSense</button>
    </span>
  </header>

  <div class="section"><span id="sec-info" data-i18n="popup.section_info">Current network</span><span class="dot" id="dot"></span></div>
  <div class="card">
    <div class="row"><span class="k" id="k-profile" data-i18n="popup.profile">Applied profile</span><span class="v" id="v-profile">—</span></div>
    <div class="row" id="workers-row" hidden><span class="k" id="k-workers" data-i18n="popup.workers">Maintained</span><span class="v" id="v-workers">—</span></div>
    <div class="row"><span class="k" id="k-iface" data-i18n="popup.interface">Interface</span><span class="v" id="v-iface">—</span></div>
    <div class="row"><span class="k" id="k-ssid" data-i18n="status.ssid">SSID</span><span class="v" id="v-ssid">—</span></div>
    <div class="row"><span class="k" id="k-mac" data-i18n="popup.mac">MAC</span><span class="v" id="v-mac">—</span></div>
    <div class="row"><span class="k" id="k-ip" data-i18n="popup.ip">IPv4</span><span class="v" id="v-ip">—</span></div>
    <div class="row"><span class="k" id="k-netmask" data-i18n="popup.netmask">Netmask</span><span class="v" id="v-netmask">—</span></div>
    <div class="row"><span class="k" id="k-gateway" data-i18n="popup.gateway">Gateway</span><span class="v" id="v-gateway">—</span></div>
    <div class="row"><span class="k" id="k-ipv6" data-i18n="popup.ipv6">IPv6</span><span class="v" id="v-ipv6">—</span></div>
    <div class="row"><span class="k" id="k-dns" data-i18n="popup.dns">DNS</span><span class="v" id="v-dns">—</span></div>
  </div>

  <div class="section" id="sec-other" data-i18n="popup.other_nics" hidden>Other active interfaces</div>
  <div class="cards" id="nics" hidden></div>

  <div class="section" id="sec-vpn" data-i18n="popup.vpn">VPN / virtual adapters</div>
  <div class="cards" id="vpns"></div>

  <div class="section" id="sec-switch" data-i18n="popup.quick_switch">Quick Switch</div>
  <div class="switches" id="switches"></div>

  <footer>
    <button class="primary" id="btn-editor" data-i18n="popup.automation">Automation</button>
    <button id="btn-settings" data-i18n="popup.settings">Settings</button>
    <button id="btn-logs" data-i18n="popup.logs">Logs</button>
    <button id="btn-dhcp" data-i18n="popup.dhcp">DHCP</button>
    <button id="btn-probe" data-i18n="popup.probe">Probe</button>
    <button id="btn-update" data-i18n="popup.check_update">Check for Updates</button>
  </footer>
  <div class="toast" id="toast"></div>
  <div class="modal-mask" id="update-mask" hidden>
    <div class="modal" id="update-modal"></div>
  </div>

  <script>
    const hasTauri = () => window.__TAURI__ && window.__TAURI__.core;
    const invoke = (cmd, args) => {
      if (!hasTauri()) return Promise.reject(new Error("no tauri bridge"));
      return window.__TAURI__.core.invoke(cmd, args);
    };
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    let strings = {};
    let langShown = "";
    const t = (k, d) => strings[k] || d || k;
    // `<html lang>` 跟着后端走：读屏软件和 CJK 字形选择都看这个属性，写死成 en
    // 等于界面换成日文了还告诉辅助技术「这是英语」。
    const syncLang = () => invoke("get_language")
      .then((c) => { document.documentElement.lang = c; })
      .catch(() => {});
    // 配色那一档由后端定：问操作系统的是它一处，四座窗口看到的才是同一份答案。
    // 面板不需要单独去问 —— 每次 refresh 读的状态里就带着它，而「被点开」正是
    // 唯一需要重新对色的时刻。`theme.css` 只认 `<html data-theme>` 这一个属性。
    const applyTheme = (k) => { if (k) document.documentElement.dataset.theme = k; };
    let nics = [];

    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg; el.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove("show"), 1800);
    }

    // 界面文案只有一份来源：后端字典。静态标记里的英文是「问不到字典时」的兜底，
    // 由闸门要求与字典的 en 值逐字一致；真正的文本靠 data-i18n 刷出来 ——
    // 逐个 id 手写赋值早晚会长出「界面上多了一个标签，没人给它换语言」。
    function applyI18n() {
      const put = (n, key, set) => { const v = strings[key]; if (v) set(v); };
      for (const n of document.querySelectorAll("[data-i18n]"))
        put(n, n.dataset.i18n, (v) => { n.textContent = v; });
      for (const n of document.querySelectorAll("[data-i18n-placeholder]"))
        put(n, n.dataset.i18nPlaceholder, (v) => n.setAttribute("placeholder", v));
      for (const n of document.querySelectorAll("[data-i18n-title]"))
        put(n, n.dataset.i18nTitle, (v) => n.setAttribute("title", v));
      syncLang();
    }

    const kindLabel = (kind) => kind === "wireless" ? t("popup.kind_wireless", "Wi-Fi")
      : kind === "wired" ? t("popup.kind_wired", "Wired")
      : kind === "vpn" ? t("popup.kind_vpn", "VPN") : t("popup.kind_other", "Other");

    /// 网卡怎么称呼自己：光有设备名不够，`en0` 后面要跟上「这是哪一口」。
    /// 系统给的设备标签（macOS 的 Hardware Port、Windows 的 InterfaceDescription）本身
    /// 就带类型信息，优先用它；它已经含设备名时不再重复一遍。隧道口在系统服务表里没有
    /// 条目（标签为空），这时退回按种类标注。
    const nicTitle = (n) => {
      const label = (n.label || "").trim();
      if (!label) return `${n.name} (${kindLabel(n.kind)})`;
      return label.toLowerCase().includes(n.name.toLowerCase())
        ? label : `${n.name} (${label})`;
    };

    /// 一行明细：值为空就整行不给看（面板窄，`—` 排成一片等于没有信息）
    const setRow = (id, v) => {
      const el = document.getElementById("v-" + id);
      el.textContent = v || "—";
      const row = el.closest(".row");
      if (row) row.hidden = !v;
      return el;
    };

    /// 路由那一格：最多摆三条，剩下的写成「+N」。
    /// 面板只有几十字宽，而一条隧道的 `allowed-ips` 可以是一片 /32。
    /// `0.0.0.0/0` / `::/0` 是「一切」而不是一条路由：默认往哪走已由网关行回答，
    /// 这里只剩真正带信息量的前缀要摆。
    const routeText = (list) => {
      const rs = (list || []).filter((r) => r !== "0.0.0.0/0" && r !== "::/0");
      return rs.length > 3
        ? rs.slice(0, 3).join(", ") + " +" + (rs.length - 3)
        : rs.join(", ");
    };

    /// 真正能摆出来的下一跳：`0.0.0.0` / `::` 是各平台的 on-link 伪网关，macOS 还把
    /// 点对点隧道的下一跳写成 `link#N` —— 都不是地址，摆出来只会教人误读，整行不给看。
    const routableGateway = (v) => {
      const s = (v || "").trim();
      return !s || s.startsWith("link#") || s === "0.0.0.0" || s === "::" ? null : s;
    };

    /// 一张网卡的卡片：名称 + 类型标签 + 连接状态（状态在标题行右侧）+ 关键字段
    /// （取不到的字段整行不显示）。
    ///
    /// VPN 卡的标题就是**归属软件名**，明细按「接口 → 地址 → 网关 → 路由」排：两个网关行
    /// 只在下一跳是真地址时出现，带「(默认出口)」注记说明它来自这张卡的默认路由
    /// （`0.0.0.0/0` / `::/0`，各平台都只从那里采它）；「网关或路由」只剩前缀表里具体的
    /// 网段（诸如 10.30.35.0/24）。这一段现在也列「装了但没连」的会话，一张不带地址的卡
    /// 看着像采集失败而它其实是准的，所以状态必须写在卡上；没连的会话没有出口设备，那一行
    /// 整个不给看（标题位置上是它的会话标签，那是用户自己在客户端里取的名字）。
    /// 认不出归属软件时标题退回设备名、标签仍是通用的「VPN」：少一格信息可以，给这条隧道
    /// 安一个错牌子不行（判据见 `platform::macos::attribute_vpn`）。
    function nicCard(n) {
      const vpn = n.kind === "vpn";
      const title = vpn ? (n.app || n.name) : nicTitle(n);
      const tag = kindLabel(n.kind);
      const state = vpn
        ? (n.up ? t("popup.connected", "Connected") : t("popup.disconnected", "Not connected"))
        : "";
      const rows = [];
      if (vpn) {
        const gw = routableGateway(n.gateway);
        const gw6 = routableGateway(n.gateway6);
        const egress = " " + t("popup.default_egress", "(default egress)");
        if (n.up) rows.push([t("popup.vpn_egress", "Interface"), n.name]);
        if (n.ipv4) rows.push([t("popup.ip", "IPv4"), n.ipv4 + (n.netmask ? " / " + n.netmask : "")]);
        if (n.ipv6) rows.push([t("popup.ipv6", "IPv6"), n.ipv6]);
        if (gw) rows.push([t("popup.gateway", "Gateway"), gw + egress]);
        if (gw6) rows.push([t("popup.gateway6", "Gateway (IPv6)"), gw6 + egress]);
        const routes = routeText(n.routes);
        if (routes) rows.push([t("popup.vpn_routes", "Gateway / routes"), routes]);
        if (n.dns) rows.push([t("popup.dns", "DNS"), n.dns]);
      } else {
        if (n.ssid) rows.push([t("status.ssid", "SSID"), n.ssid]);
        if (n.mac) rows.push([t("popup.mac", "MAC"), n.mac]);
        if (n.ipv4) rows.push([t("popup.ip", "IPv4"), n.ipv4 + (n.netmask ? " / " + n.netmask : "")]);
        if (n.ipv6) rows.push([t("popup.ipv6", "IPv6"), n.ipv6]);
        if (n.gateway) rows.push([t("popup.gateway", "Gateway"), n.gateway]);
        if (n.dns) rows.push([t("popup.dns", "DNS"), n.dns]);
      }
      return `<div class="nic-card">
        <div class="nic-head">
          <span class="nic-name">${esc(title)}</span>
          <span class="nic-end">
            <span class="nic-tag${vpn ? " vpn" : ""}">${esc(tag)}</span>
            ${state ? `<span class="nic-state${n.up ? " on" : ""}">${esc(state)}</span>` : ""}
          </span>
        </div>
        ${rows.map(([k, v]) => `<div class="nic-row"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`).join("")}
      </div>`;
    }

    // 后端 `get_interfaces` 保证列表第一张就是「在用的那张」（判据见 automation::primary_nic），
    // 所以这里不需要在前端再实现一遍选主网卡的规则。
    const primaryNic = () => nics.find(n => n.kind !== "vpn") || null;

    function renderNics() {
      const primary = primaryNic();
      const live = nics.filter(n => n.kind !== "vpn" && n !== primary);
      const vpns = nics.filter(n => n.kind === "vpn");
      // 「在用网卡」不再单列一段：主网卡并进上面的明细，其余网卡才列在这里。
      document.getElementById("sec-other").hidden = !live.length;
      document.getElementById("nics").hidden = !live.length;
      document.getElementById("nics").innerHTML = live.map(nicCard).join("");
      document.getElementById("vpns").innerHTML = vpns.length
        ? vpns.map(nicCard).join("")
        : `<div class="empty">${esc(t("popup.vpn_none", "none connected"))}</div>`;
    }

    // ——————— 引擎视图：状态只在 `engine` 里，Profile 清单只是名字目录 ———————
    const engOf = (data) => data.engine || {};
    const viewsOf = (data) => engOf(data).profiles || [];
    const viewOf = (data, id) => viewsOf(data).find(p => p.id === id) || null;
    const nameOf = (data, id) => {
      const v = viewOf(data, id) || (data.profiles || []).find(p => p.id === id);
      return v ? (v.name || v.id) : id;
    };
    const STATUS_LABEL = {
      active: "editor.status_active", conflict: "editor.status_conflict",
      error: "editor.status_error", disabled: "editor.status_disabled",
      not_matched: "editor.status_nomatch", suspended: "editor.status_suspended",
    };
    const statusText = (s) => (STATUS_LABEL[s] ? t(STATUS_LABEL[s], s.toUpperCase()) : "");
    // worker 的状态词只有五个，而且编辑器里已经有同一份 —— 面板复用，不另造一套 key
    const WORKER_LABEL = {
      pending: "editor.worker_pending", satisfied: "editor.worker_satisfied",
      repaired: "editor.worker_repaired", faulted: "editor.worker_faulted",
      overdue: "editor.worker_overdue",
    };
    const workerWord = (s) => t(WORKER_LABEL[s] || "", s);

    function render(data) {
      const st = data.status || {};
      const connected = !!st.connected;
      document.getElementById("dot").className = "dot" + (connected ? " on" : "");

      const eng = engOf(data);
      const dec = eng.state || {};
      const pv = document.getElementById("v-profile");
      pv.classList.remove("warn", "bad");
      if (dec.state === "active") {
        const a = viewOf(data, dec.id);
        // 「设为 DHCP」后的暂停：判定暂时还指着它，但引擎已经住手了 —— 说成
        // 「已暂停」并给 warn 色，别让它看起来仍然生效。
        if (a && a.status === "suspended") {
          pv.textContent = t("status.suspended", "Automation paused until the network changes");
          pv.classList.add("warn");
        } else {
          pv.textContent = nameOf(data, dec.id) + (a && a.error ? " × " + a.error : "");
          if (a && a.error) pv.classList.add("bad");
        }
      } else if (dec.state === "conflict") {
        pv.textContent = t("status.conflict", "Conflict: {names}")
          .replace("{names}", (dec.ids || []).map(id => nameOf(data, id)).join(", "));
        pv.classList.add("warn");
      } else {
        pv.textContent = t("status.no_profile", "No profile applied");
      }

      // 3B2 常驻 worker：面板只报「此刻在维持什么、哪一条没维持住」。逐条的间隔与
      // 恢复次数在编辑器的常驻卡片上 —— 这里窄，塞两行芯片只会把网卡明细挤下去。
      const ws = eng.workers || [];
      const wRow = document.getElementById("workers-row");
      const wv = document.getElementById("v-workers");
      wRow.hidden = !ws.length;
      if (wRow.hidden) {
        wv.textContent = "—";
        wv.className = "v";
        wv.title = "";
      } else {
        const bad = ws.filter(w => w.state === "faulted").length;
        const late = ws.filter(w => w.state === "overdue").length;
        wv.textContent = ws.map(w => `${w.label} · ${workerWord(w.state)}`).join("  ");
        wv.className = "v" + (bad ? " bad" : (late ? " warn" : ""));
        wv.title = "\n" + ws.map(w => `${w.label}: ${w.error || workerWord(w.state)}`).join("\n");
      }

      // 「在用的那张网卡」的明细：主网卡由 Rust 侧选定（`automation::primary_nic`）并放在
      // `get_interfaces` 首位，这里只把它的字段与状态快照合并展示，取不到的整行收起。
      // SSID 只属于无线：有线主网卡上 `status` 是历史快照，摆出来会指错网络。
      const primary = primaryNic();
      const wireless = !primary || primary.kind === "wireless";
      setRow("iface", primary ? nicTitle(primary) : st.iface);
      let ssid = st.ssid || (primary && primary.ssid) || "";
      // 「已连接但读不到 SSID」（macOS 15.6+ 的系统限制）不能显示成「未连接」——
      // 那会与同一面板上的绿点、IP / DNS 行自相矛盾。
      if (!ssid) ssid = connected ? t("status.ssid_unknown", "Unknown") : t("popup.disconnected", "Not connected");
      setRow("ssid", wireless ? ssid : "");
      setRow("mac", primary && primary.mac);
      setRow("ip", st.ipv4 || (primary && primary.ipv4));
      setRow("netmask", (primary && primary.netmask) || st.netmask);
      setRow("gateway", st.gateway || (primary && primary.gateway));
      setRow("ipv6", primary && primary.ipv6);
      setRow("dns", st.dns || (primary && primary.dns));

      // 快速切换区只列 Profile 上勾了「放入快速切换区」的那些（`quick`，默认勾选）。
      // 取消勾选只是在面板收起，编辑器里它仍然存在、仍然参与条件匹配。
      const all = data.profiles || [];
      const rows = all.filter(p => p.quick !== false);
      const list = document.getElementById("switches");
      if (!rows.length) {
        list.innerHTML = `<div class="empty">${esc(t(
          all.length ? "popup.quick_none" : "popup.no_profiles",
          all.length ? "No profile marked for quick switch" : "No configured networks"))}</div>`;
        return;
      }
      // 「立即应用」不绕过条件：后端会重新评估该 Profile 自己，冲突时直接拒绝，
      // 所以这里照旧把按钮摆出来，把决定权交给引擎（错误信息原样 toast）。
      list.innerHTML = rows.map(p => {
        const v = viewOf(data, p.id);
        const s = v ? v.status : (p.enabled ? "" : "disabled");
        // 「当前」跟着**生效**走（生效状态只有引擎说得算）：suspended 不算 —— 那时
        // 网卡在 DHCP 手上，这一行要留着 Apply 让用户能手动叫回来。
        const on = s === "active";
        return `<div class="sw${on ? " current" : ""}${p.enabled ? "" : " disabled"}" data-id="${esc(p.id)}" data-name="${esc(p.name || p.id)}">
                  <span>${esc(p.name || p.id)}</span>
                  <span style="display:flex;gap:6px;align-items:center;">
                    <span class="st ${esc(s)}">${esc(statusText(s))}</span>
                    <span class="go">${on ? "" : esc(t("popup.apply", "Apply"))}</span>
                  </span>
                </div>`;
      }).join("");
      list.querySelectorAll(".sw").forEach(el => {
        el.onclick = () => apply(el.dataset.id, el.dataset.name);
      });
    }

    function detectPlatform() {
      const ua = navigator.userAgent || "";
      if (/Mac/i.test(ua)) return "macos";
      if (/Win/i.test(ua)) return "windows";
      if (/Linux/i.test(ua)) return "linux";
      return "other";
    }

    function closeUpdateModal() {
      document.getElementById("update-mask").hidden = true;
    }

    // 失败/无可用安装包时，回退到「打开发布页」这一永远可用的手动路径
    function openReleaseFallback(d) {
      if (d && d.html_url) invoke("open_url", { url: d.html_url }).catch(() => {});
      closeUpdateModal();
    }

    /// 后端 `install_note` → 界面上的一句完整话。
    ///
    /// 「本平台没有安装包」本来就是现成的整句，直接用它；两种校验问题才拼进
    /// 「无法校验：{reason}」—— 拼接越少，五种语言里语法出错的地方越少。
    function verifyText(code) {
      if (code === "no_asset") {
        return t("popup.no_installable", "No installable package for this platform");
      }
      const reason = code === "sums_unreachable"
        ? t("popup.verify_unreachable", "SHA256SUMS could not be downloaded")
        : t("popup.verify_no_sums", "the release publishes no SHA256SUMS, or that file does not list this installer");
      return t("popup.cannot_verify", "This update cannot be verified: {reason}").replace("{reason}", reason);
    }

    // 弹窗渲染：发现新版本 / 已是最新 / 检查失败 三种态
    function renderUpdate(d) {
      const mask = document.getElementById("update-mask");
      const box = document.getElementById("update-modal");
      if (!d || d.__error) {
        box.innerHTML = `<h3>${esc(t("popup.update_failed", "Failed to check for updates"))}</h3>
          <div class="mv">${esc(d && d.__error ? d.__error : "")}</div>
          <div class="row-btns"><button id="up-close">${esc(t("popup.close", "Close"))}</button></div>`;
        mask.hidden = false;
        document.getElementById("up-close").onclick = closeUpdateModal;
        return;
      }
      if (!d.update_available) {
        box.innerHTML = `<h3>${esc(t("popup.up_to_date", "You're up to date"))}</h3>
          <div class="mv">${esc(t("popup.current", "Current"))}: <b>${esc(d.current)}</b></div>
          <div class="row-btns"><button id="up-close">${esc(t("popup.close", "Close"))}</button></div>`;
        mask.hidden = false;
        document.getElementById("up-close").onclick = closeUpdateModal;
        return;
      }
      // 有更新：默认动作就是「下载并安装」（Homebrew 渠道则 brew upgrade），不再只给命令。
      // 但后端在检查阶段就判定「这个更新装不了 / 验不了」时，按钮根本不给：校验不过去是硬
      // 失败（`run_update` 拒绝安装未校验的资产），点了才报错不如现在就说清只能去发布页。
      const brewNote = d.homebrew
        ? `<div class="mv">${esc(t("popup.brew_note", "Installed via Homebrew — Update Now runs: brew upgrade --cask netsense"))}</div>`
        : "";
      const unverifiable = d.installable === false;
      const verifyNote = unverifiable ? `<div class="err">${esc(verifyText(d.install_note))}</div>` : "";
      const updateBtn = unverifiable
        ? ""
        : `<button id="up-now" class="primary">${esc(t("popup.update_now", "Update Now"))}</button>`;
      const notes = d.notes ? `<div class="notes">${esc(d.notes)}</div>` : "";
      box.innerHTML = `<h3>${esc(t("popup.update_available", "Update available"))}</h3>
        <div class="mv">${esc(t("popup.current", "Current"))}: <b>${esc(d.current)}</b></div>
        <div class="mv">${esc(t("popup.latest", "Latest"))}: <b>${esc(d.latest)}</b></div>
        ${brewNote}
        ${verifyNote}
        <div class="row-btns">
          ${updateBtn}
          <button id="up-rel">${esc(t("popup.release_page", "Release Page"))}</button>
        </div>
        ${notes}
        <div class="row-btns"><button id="up-close">${esc(t("popup.close", "Close"))}</button></div>`;
      mask.hidden = false;
      const now = document.getElementById("up-now");
      if (now) now.onclick = () => startUpdate(d);
      if (d.html_url) {
        document.getElementById("up-rel").onclick = () => invoke("open_url", { url: d.html_url }).catch(() => {});
      }
      document.getElementById("up-close").onclick = closeUpdateModal;
    }

    // 执行下载 + 安装（Homebrew 渠道内部走 brew upgrade）。进度由
    // `netsense://update_progress` 事件驱动（见底部 listener）。
    let updating = false;
    async function startUpdate(d) {
      if (updating) return;
      updating = true;
      const target = {
        download_url: d.download_url || null,
        asset_name: d.asset_name || null,
        checksum_url: d.checksum_url || null,
        size: d.size || null,
        version: d.latest,
      };
      // 既没有匹配安装包、又非 Homebrew → 无法直接安装，回退发布页
      if (!d.homebrew && !target.download_url) {
        toast(t("popup.no_installable", "No installable package for this platform"));
        openReleaseFallback(d);
        updating = false;
        return;
      }
      showUpdating();
      try {
        await invoke("run_update", { target: JSON.stringify(target) });
        // 控制返回说明未被替换进程杀掉（如 brew 退出 0），提示重启用
        showUpdateResult(true, d);
      } catch (e) {
        // 失败回退到发布页 + 显式报错
        showUpdateResult(false, d, String(e));
      } finally {
        updating = false;
      }
    }

    function showUpdating() {
      const box = document.getElementById("update-modal");
      box.innerHTML = `<h3>${esc(t("popup.updating", "Updating…"))}</h3>
        <div class="mv" id="up-phase">${esc(t("popup.downloading", "Downloading…"))}</div>
        <div class="progress"><div class="bar indeterminate" id="up-bar"></div></div>
        <div class="mv" id="up-pct"></div>`;
    }

    // 由后端进度事件调用；phase: download / refresh / install / ""（清除）
    function showUpdateProgress(phase, percent) {
      const bar = document.getElementById("up-bar");
      const ph = document.getElementById("up-phase");
      const pct = document.getElementById("up-pct");
      if (!bar || !ph) return;
      const label = phase === "refresh" ? t("popup.refreshing", "Refreshing Homebrew…")
        : phase === "install" ? t("popup.installing", "Installing…")
        : t("popup.downloading", "Downloading…");
      ph.textContent = label;
      const p = Math.max(0, Math.min(100, percent || 0));
      // 有确定百分比才画实心进度；否则（安装/刷新阶段，或总大小未知时的下载起步）
      // 用不确定动画，免得进度条停在 0% 看上去像卡死。
      if (phase === "" || phase === "install" || phase === "refresh" || p <= 0) {
        bar.classList.add("indeterminate");
        bar.style.width = "";
        if (pct) pct.textContent = "";
      } else {
        bar.classList.remove("indeterminate");
        bar.style.width = p + "%";
        if (pct) pct.textContent = p + "%";
      }
    }

    function showUpdateResult(ok, d, err) {
      const box = document.getElementById("update-modal");
      if (ok) {
        box.innerHTML = `<h3>${esc(t("popup.update_ok", "Update complete"))}</h3>
          <div class="mv">${esc(t("popup.update_restart", "Restarting…"))}</div>
          <div class="row-btns"><button id="up-close">${esc(t("popup.close", "Close"))}</button></div>`;
      } else {
        box.innerHTML = `<h3>${esc(t("popup.update_failed", "Update failed"))}</h3>
          <div class="err">${esc(err || "")}</div>
          <div class="row-btns">
            <button id="up-rel">${esc(t("popup.release_page", "Release Page"))}</button>
            <button id="up-close">${esc(t("popup.close", "Close"))}</button>
          </div>`;
        if (d && d.html_url) {
          document.getElementById("up-rel").onclick = () => invoke("open_url", { url: d.html_url }).catch(() => {});
        }
      }
      const c = document.getElementById("up-close");
      if (c) c.onclick = closeUpdateModal;
    }

    async function checkForUpdate() {
      const mask = document.getElementById("update-mask");
      document.getElementById("update-modal").innerHTML =
        `<h3>${esc(t("popup.updating", "Checking…"))}</h3>`;
      mask.hidden = false;
      const r = await invoke("check_update").catch(e => ({ __error: String(e) }));
      const d = (typeof r === "string") ? JSON.parse(r) : r;
      renderUpdate(d);
    }

    /// 标题上的版本号：与软件设置窗口读同一个来源（`get_app_settings`）。
    /// 排障时「我手上是哪一版」这句话要在开面板的那一刻就能说出口；取不到就整段不显示。
    function showVersion() {
      invoke("get_app_settings").then((raw) => {
        const d = typeof raw === "string" ? JSON.parse(raw) : raw;
        if (d && d.version) document.getElementById("ver").textContent = "v" + d.version;
      }).catch(() => {});
    }

    async function refresh() {
      try {
        const raw = await invoke("get_status");
        const data = typeof raw === "string" ? JSON.parse(raw) : raw;
        if (data.language && data.language !== langShown) {
          // 语言是在软件设置窗口里改的，这里只是跟着换词表。按「变了没有」判断，
          // 而不是每次刷新都往返拉一遍 200 多条文案。
          langShown = data.language;
          strings = await invoke("get_strings");
        }
        applyTheme(data.theme);
        // 网卡清单先取再渲染：面板第一段要显示的就是「在用的那张」的 MAC / 掩码 / IPv6，
        // 而主网卡的判据只在 Rust 里有一份（列表首位即主网卡）。
        const rawNics = await invoke("get_interfaces");
        nics = typeof rawNics === "string" ? JSON.parse(rawNics) : (rawNics || []);
        applyI18n();
        render(data);
        renderNics();
      } catch (e) { /* 非 Tauri 环境（浏览器直接打开）时静默 */ }
    }

    async function apply(id, name) {
      if (!id) return;
      try {
        await invoke("apply_profile", { id });
        // 命令只把请求排进引擎队列，真正的结果由 `netsense://action` 广播回来
        toast(t("notify.apply_requested", "Applying {name}…").replace("{name}", name || id));
        await refresh();
      } catch (e) {
        toast(String(e));
      }
    }

    // 面板上的「自动化配置」直达编辑器（配置 Profile / 条件 / 动作的那个窗口），
    // 「设置」指向**软件设置**（语言、开机启动、日志）。两份配置各有自己的入口。
    document.getElementById("btn-editor").onclick = () => invoke("open_editor").catch(() => {});
    document.getElementById("btn-settings").onclick = () => invoke("open_settings").catch(() => {});
    // 「日志」开的是**读日志的那个窗口**，不是文件管理器：面板上按它的人要的是看一眼
    // 刚才发生了什么，而不是被丢进一堆 .log 文件前面。目录入口在软件设置里。
    document.getElementById("btn-logs").onclick = () => invoke("open_log_viewer").catch(() => {});
    document.getElementById("btn-quit").onclick = () => invoke("quit_app").catch(() => {});
    // DHCP / 探测都在后台线程执行（可能触发系统授权框），这里只负责发起。
    // 点击时只报「已发起」：真正的结果（含失败）由 `netsense://action` 回来时 toast ——
    // 点一下就报完成，碰上授权被取消就是先报成功再报失败。
    document.getElementById("btn-dhcp").onclick = async () => {
      try { await invoke("force_dhcp"); toast(t("notify.dhcp_running", "Switching to DHCP…")); }
      catch (e) { toast(String(e)); }
    };
    document.getElementById("btn-probe").onclick = async () => {
      try { await invoke("probe_network"); toast(t("notify.probe_running", "Probing…")); }
      catch (e) { toast(String(e)); }
    };
    document.getElementById("btn-update").onclick = () => checkForUpdate();

    // 面板每次获得焦点（被托盘点开）时刷新一次，保证数据新鲜
    window.addEventListener("focus", refresh);
    // 后端在网络切换 / 配置重载后会广播，面板与编辑器同步刷新
    if (window.__TAURI__ && window.__TAURI__.event) {
      window.__TAURI__.event.listen("netsense://status", () => refresh());
      // 后台动作（DHCP / 探测）完成后把结果 toast 出来
      window.__TAURI__.event.listen("netsense://action", (e) => {
        const p = e.payload || {};
        toast(p.message || (p.ok ? t("editor.action_ok", "OK") : t("editor.action_failed", "Failed")));
      });
      // 在线升级进度（下载 / 刷新 / 安装阶段 + 百分比）
      window.__TAURI__.event.listen("netsense://update_progress", (e) => {
        const p = e.payload || {};
        showUpdateProgress(p.phase, p.percent);
      });
    }
    (async () => {
      try { strings = await invoke("get_strings"); } catch (e) {}
      applyI18n();
      showVersion();
      refresh();
      // 启动后静默检查一次：发现新版本才弹窗，且本次会话只提示一次
      setTimeout(() => {
        invoke("check_update").then(r => {
          const d = (typeof r === "string") ? JSON.parse(r) : r;
          if (d && d.update_available && !sessionStorage.getItem("ns_update_seen")) {
            sessionStorage.setItem("ns_update_seen", d.latest || "1");
            renderUpdate(d);
          }
        }).catch(() => {});
      }, 4000);
    })();
  </script>
</body>
</html>
